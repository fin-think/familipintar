<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Mandarin | Famili Pintar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f8fafc;
        }
        .toast-enter {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
        .toast-leave {
            transform: translateY(-20px) scale(0.9);
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header Section -->
    <header class="pt-12 pb-8 text-center px-4 relative">
        <!-- Butang Kembali & Paparan Wallet -->
        <div class="absolute top-4 left-4 right-4 flex justify-between items-center max-w-6xl mx-auto">
            <button onclick="window.location.href='index.html'" class="bg-white border border-slate-200 text-slate-600 px-4 py-2 rounded-full font-bold text-sm shadow-sm hover:bg-slate-50 transition-all">
                ⬅ Kembali
            </button>
            <div class="bg-yellow-100 text-yellow-700 px-4 py-2 rounded-full font-bold text-sm border border-yellow-300 shadow-sm flex items-center gap-1">
                💰 Kredit Anda: <span id="displayKredit" class="text-yellow-800 text-base">0</span>
            </div>
        </div>

        <h1 class="text-4xl md:text-5xl font-extrabold text-slate-800 drop-shadow-sm mb-3 mt-8">
            Belajar Mandarin
        </h1>
        <p class="text-slate-500 max-w-lg mx-auto font-medium">
            Kuasai bahasa Mandarin bermula dari asas. Tahap 1 adalah percuma. Gunakan 5 Kredit Wallet anda untuk membuka setiap tahap seterusnya.
        </p>
    </header>

    <!-- Main Container for Cards -->
    <main class="max-w-6xl mx-auto px-6">
        <div id="cards-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 justify-center">
            <!-- Kad di-render di sini -->
        </div>
    </main>

    <!-- Modal Unlock Guna Kredit -->
    <div id="unlock-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 px-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8 transform scale-95 transition-transform duration-300" id="modal-content">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-blue-100 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                    💎
                </div>
                <h2 class="text-2xl font-bold text-slate-800" id="modal-tajuk">Buka Tahap</h2>
                <p class="text-slate-500 text-sm mt-2">Anda memerlukan <strong class="text-blue-600">5 Kredit</strong> untuk membuka akses kekal ke modul ini.</p>
            </div>

            <div class="space-y-4">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-center mb-4">
                    <p class="text-sm text-slate-500 font-semibold mb-1">Baki Kredit Semasa Anda:</p>
                    <p class="text-2xl font-bold text-slate-800"><span id="modal-baki">0</span> 💰</p>
                </div>
                
                <button onclick="prosesTolakKredit()" id="btn-unlock" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-200 transition-all active:scale-95">
                    Buka Kunci (Tolak 5 Kredit)
                </button>
                <button onclick="window.location.href='topup.html'" id="btn-topup" class="hidden w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-xl shadow-lg transition-all">
                    Kredit Tak Cukup - Top Up Sekarang
                </button>
                <button onclick="closeModal()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-3 rounded-xl transition-all">
                    Batal
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-[60] bg-red-500 text-white px-6 py-3 rounded-full shadow-lg font-semibold flex items-center gap-2 transition-all duration-300 toast-leave">
        <span id="toast-icon">❌</span>
        <span id="toast-message">Mesej ralat.</span>
    </div>

    <!-- FIREBASE SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Konfigurasi Firebase Universal Famili Pintar
        const firebaseConfig = {
            apiKey: "AIzaSyA7SW4U--evGtfRyPz5Feh3mEN8MF92gTg",
            authDomain: "familipintar.firebaseapp.com",
            databaseURL: "https://familipintar-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "familipintar",
            storageBucket: "familipintar.firebasestorage.app",
            messagingSenderId: "277029764059",
            appId: "1:277029764059:web:0a21bb2e01d868b1ed05fe",
            measurementId: "G-S3RP7E4460"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State Pengguna
        let penggunaSemasa = null;
        let bakiKredit = 0;
        let tahapTerbuka = [1]; // Tahap 1 sentiasa percuma
        let targetTahapId = null; 
        let targetTahapUrl = null;
        // Senarai tahap pembelajaran dengan warna dan data berbeza
        const levels = [
            { 
  id: 1, 
  title: "Tahap 1", 
  hanzi: "基础内容", 
  pinyin: "jī chǔ nèi róng", 
  meaning: "Kandungan asas",
  desc: "1. 数字 shù zì (Nombor)\n2. 身体部位 shēn tǐ bù wèi (Bahagian Badan)\n3. 代词 dài cí (Kata Ganti Nama)\n4. 家庭 jiā tíng (Keluarga)\n5. 家居物品 jiā jū wù pǐn (Barangan Rumah)\n6. 日常问候 rì cháng wèn hòu (Ucapan Harian)", 
  colorClass: "bg-blue-50 border-blue-200", 
  textClass: "text-blue-600", 
  url: "./app/mandarin1.0.html" 
},

{ 
  id: 2, 
  title: "Tahap 2", 
  hanzi: "日常生活", 
  pinyin: "rì cháng shēng huó",
   meaning: "Kandungan asas",
  desc: "1. 食物与饮料 shí wù yǔ yǐn liào (Makanan & Minuman)\n2. 时间与日程 shí jiān yǔ rì chéng (Masa & Jadual)\n3. 公共场所 gōng gòng chǎng suǒ (Tempat Awam)\n4. 方向与位置 fāng xiàng yǔ wèi zhì (Arah & Lokasi)\n5. 购物 gòu wù (Shopping)\n6. 交通 jiāo tōng (Pengangkutan)", 
  colorClass: "bg-emerald-50 border-emerald-200", 
  textClass: "text-emerald-600", 
  url: "./app/mandarin2.0.html" 
},

{ 
  id: 3, 
  title: "Tahap 3", 
  hanzi: "日常交流", 
  pinyin: "rì cháng jiāo liú", 
  meaning: "Kandungan asas",
  desc: "1. 在餐厅 zài cān tīng (Perbualan Restoran)\n2. 日常活动与爱好 rì cháng huó dòng yǔ ài hào (Aktiviti & Hobi)\n3. 天气与季节 tiān qì yǔ jì jié (Cuaca & Musim)\n4. 感觉与情绪 gǎn jué yǔ qíng xù (Perasaan & Emosi)\n5. 电话与聊天 diàn huà yǔ liáo tiān (Telefon & Chat)\n6. 活动与节日 huó dòng yǔ jié rì (Perayaan Malaysia)", 
  colorClass: "bg-amber-50 border-amber-200", 
  textClass: "text-amber-600", 
  url: "./app/mandarin3.0.html" 
},

{ 
  id: 4, 
  title: "Tahap 4", 
  hanzi: "工作与生活", 
  pinyin: "gōng zuò yǔ shēng huó",
  meaning: "Kandungan asas",
  desc: "1. 工作面试 gōng zuò miàn shì (Temuduga)\n2. 工作场所 gōng zuò chǎng suǒ (Tempat Kerja)\n3. 商业与买卖 shāng yè yǔ mǎi mài (Bisnes)\n4. 问题与投诉 wèn tí yǔ tóu sù (Aduan)\n5. 健康与医院 jiàn kāng yǔ yī yuàn (Kesihatan)\n6. 旅行与酒店 lǚ xíng yǔ jiǔ diàn (Travel & Hotel)", 
  colorClass: "bg-purple-50 border-purple-200", 
  textClass: "text-purple-600", 
  url: "./app/mandarin4.0.html" 
},

{ 
  id: 5, 
  title: "Tahap 5", 
  hanzi: "高级交流", 
  pinyin: "gāo jí jiāo liú", 
  meaning: "Kandungan asas",
  desc: "1. 深入对话 shēn rù duì huà (Perbualan Mendalam)\n2. 俚语与口语 lǐ yǔ yǔ kǒu yǔ (Slang & Santai)\n3. 文化与礼仪 wén huà yǔ lǐ yí (Budaya & Etika)\n4. 故事与叙述 gù shì yǔ xù shù (Storytelling)\n5. 媒体与娱乐 méi tǐ yǔ yú lè (Media & Hiburan)\n6. 复杂情况 fù zá qíng kuàng (Situasi Kompleks)", 
  colorClass: "bg-rose-50 border-rose-200", 
  textClass: "text-rose-600", 
  url: "./app/mandarin5.0.html" 
}
        ];

      // --- PENGURUSAN SESI LOG MASUK ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                penggunaSemasa = user;
                await muatDataPengguna();
            } else {
                // Jika cuba masuk direct tanpa log masuk, tendang ke index
                window.location.href = "index.html";
            }
        });

        async function muatDataPengguna() {
            const snap = await getDoc(doc(db, "mynasab_users", penggunaSemasa.uid));
            if(snap.exists()){
                const data = snap.data();
                bakiKredit = data.credit_balance || 0;
                // Baca array tahap yang dah pernah dibeli. Jika belum wujud, letak [1]
                tahapTerbuka = data.mandarin_unlocked || [1]; 
                
                document.getElementById('displayKredit').innerText = bakiKredit;
                renderCards();
            }
        }

        // --- RENDER UI KAD ---
        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = ''; 

            levels.forEach(level => {
                const isLocked = !tahapTerbuka.includes(level.id);
                
                const card = document.createElement('div');
                card.className = `relative group rounded-3xl p-6 border-2 transition-all duration-300 ${level.colorClass} hover:-translate-y-2 hover:shadow-xl cursor-pointer ${isLocked ? 'opacity-80' : ''}`;
                card.onclick = () => window.handleCardClick(level.id, level.title, level.url);

                let innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <span class="inline-block px-4 py-1.5 rounded-full text-sm font-bold bg-white/70 ${level.textClass} shadow-sm backdrop-blur-sm">
                            ${level.title}
                        </span>
                        ${isLocked ? `<span class="text-2xl drop-shadow-md">🔒</span>` : `<span class="text-2xl opacity-0 group-hover:opacity-100 transition-opacity">👉</span>`}
                    </div>
                    <div class="text-center my-6">
                        <p class="text-lg text-slate-800 font-bold">${level.meaning}</p>
                    </div>
                    <p class="text-slate-600 text-left text-sm font-medium leading-relaxed whitespace-pre-line">${level.desc}</p>
                `;

                if (isLocked) {
                    innerHTML += `<div class="absolute inset-0 bg-slate-900/5 rounded-3xl group-hover:bg-slate-900/10 transition-colors"></div>`;
                }
                card.innerHTML = innerHTML;
                container.appendChild(card);
            });
        }

        // --- KLIK KAD & TOLAK KREDIT ---
        window.handleCardClick = (levelId, levelTitle, url) => {
            if (tahapTerbuka.includes(levelId)) {
                // Dah pernah buka (atau Tahap 1 percuma)
                window.location.href = url; 
            } else {
                // Kena bayar 5 kredit
                targetTahapId = levelId;
                targetTahapUrl = url;
                document.getElementById('modal-tajuk').innerText = `Buka ${levelTitle}`;
                document.getElementById('modal-baki').innerText = bakiKredit;
                
                // Semak jika baki cukup
                if (bakiKredit >= 5) {
                    document.getElementById('btn-unlock').classList.remove('hidden');
                    document.getElementById('btn-topup').classList.add('hidden');
                } else {
                    document.getElementById('btn-unlock').classList.add('hidden');
                    document.getElementById('btn-topup').classList.remove('hidden');
                }
                openModal();
            }
        };

        window.prosesTolakKredit = async () => {
            if (bakiKredit < 5) return; // double check

            try {
                // Tolak 5 kredit dan tambah tahap ke dalam array
                await updateDoc(doc(db, "mynasab_users", penggunaSemasa.uid), {
                    credit_balance: increment(-5),
                    mandarin_unlocked: arrayUnion(targetTahapId)
                });
                
                showToast("Berjaya! Tahap telah dibuka.", "success");
                closeModal();
                await muatDataPengguna(); // Muat semula UI dan baki
                
                // Boleh letak delay sikit sebelum redirect ke URL modul
                setTimeout(() => {
                    window.location.href = targetTahapUrl;
                }, 1500);

            } catch (error) {
                showToast("Ralat sistem: " + error.message, "error");
            }
        };

        // --- FUNGSI MODAL & TOAST ---
        const modal = document.getElementById('unlock-modal');
        const modalContent = document.getElementById('modal-content');

        window.openModal = () => {
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
        };

        window.closeModal = () => {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
        };

        let toastTimeout;
        function showToast(message, type = "error") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            
            if (type === "success") {
                toast.classList.replace('bg-red-500', 'bg-emerald-500');
                document.getElementById('toast-icon').textContent = "✅";
            } else {
                toast.classList.replace('bg-emerald-500', 'bg-red-500');
                document.getElementById('toast-icon').textContent = "❌";
            }

            toast.classList.remove('toast-leave');
            toast.classList.add('toast-enter');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-leave');
            }, 3000);
        }
    </script>
</body>
</html>
