<script src="https://unpkg.com/lucide@latest"></script>
    <script type="text/babel" 
       const { useState, useMemo } = React;
        
        const {
  User,
  Landmark,
  Wallet,
  BookOpen,
  CreditCard,
  Activity,
  Printer,
  MessageCircle,
  Heart,
  Users,
  TrendingUp,
  Calculator,
  ShieldCheck
} = lucide;

        // --- Komponen Bantuan (UI) ---
        const Card = ({ children, className = '' }) => (
          <div className={`bg-white rounded-xl shadow-sm border border-slate-200 p-6 ${className}`}>
            {children}
          </div>

        const Input = ({ label, value, onChange, type = 'number', prefix = '', suffix = '', min = 0, max, disabled=false, step="1", className="" }) => (
          <div className={`flex flex-col mb-4 ${className}`}>

              <input
                type={type}

                min={min}

                className={`w-full border border-slate-300 rounded-lg py-2 focus:ring-2 focus:ring-sky-500 focus:border-sky-500 outline-none transition-all ${prefix ? 'pl-9' : 'pl-3'} ${suffix ? 'pr-8' : 'pr-3'} ${disabled ? 'bg-slate-100 text-slate-500' : 'bg-white'}`}
              />
              {suffix && <span className="absolute right-3 text-slate-500 font-semibold">{suffix}</span>}

          </div>
        );

        const SectionHeader = ({ title, icon: Icon, description }) => (
          <div className="mb-6 border-b border-sky-100 pb-4">
            <div className="flex items-center gap-3">
              <div className="p-2 bg-sky-100 text-sky-700 rounded-lg">
                <Icon size={24} />
              </div>
              <div>
                <h2 className="text-xl font-bold text-slate-800">{title}</h2>
                <p className="text-sm text-slate-500">{description}</p>
              </div>
            </div>
          </div>
        );

        // Komponen Pie Chart Ringkas
        const SimplePieChart = ({ data, colors }) => {
          let cumulativePercent = 0;
          const getCoordinatesForPercent = (percent) => {
            const x = Math.cos(2 * Math.PI * percent);
            const y = Math.sin(2 * Math.PI * percent);
            return [x, y];
          };
          
          if (!data || data.length === 0 || data.every(d => d.percent <= 0)) {
            return <div className="w-full h-full rounded-full bg-slate-200 flex items-center justify-center text-xs text-slate-500">Tiada Data</div>;
          }

          return (
            <svg viewBox="-1 -1 2 2" className="w-full h-full drop-shadow-md" style={{ transform: 'rotate(-90deg)' }}>
              {data.map((slice, i) => {
                if (slice.percent <= 0) return null;
                if (slice.percent >= 99.9) return <circle cx="0" cy="0" r="1" fill={colors[i % colors.length]} key={i} />;
                const [startX, startY] = getCoordinatesForPercent(cumulativePercent / 100);
                cumulativePercent += slice.percent;
                const [endX, endY] = getCoordinatesForPercent(cumulativePercent / 100);
                const largeArcFlag = slice.percent > 50 ? 1 : 0;
                const pathData = [
                  `M ${startX} ${startY}`,
                  `A 1 1 0 ${largeArcFlag} 1 ${endX} ${endY}`,
                  `L 0 0`,
                ].join(' ');
                return <path d={pathData} fill={colors[i % colors.length]} key={i} />
              })}
            </svg>
          )
        };

        // --- Komponen Utama ---
        function App() {
          const [activeTab, setActiveTab] = useState(1);
          const [showReport, setShowReport] = useState(false);
          
 // === HELPER NUMBER SAFE ===
  const toNumber = (v) => {
    const n = parseFloat(v);
    return Number.isFinite(n) ? n : 0;
  };

          // === STATE PENGURUSAN DATA (PROFIL & PENDAPATAN) ===
          const [userGender, setUserGender] = useState('lelaki');
          const [age, setAge] = useState(30);
          const [gajiHakiki, setGajiHakiki] = useState(4000);
          const [pendapatanSampingan, setPendapatanSampingan] = useState(500);
          
          const [kwspPotongan, setKwspPotongan] = useState(11);
          const [socsoPotongan, setSocsoPotongan] = useState(50);

          const [dapurExpenses, setDapurExpenses] = useState(800);
          const [utilitiExpenses, setUtilitiExpenses] = useState(300);
          const [transportExpenses, setTransportExpenses] = useState(400);
          const [entertainmentExpenses, setEntertainmentExpenses] = useState(300);
          const [insuranceExpenses, setInsuranceExpenses] = useState(250);
          const [childrenData, setChildrenData] = useState([{ id: 1, age: 1, gender: 'lelaki' }]);
          
          // === STATE ASET SEMASA ===
          const [asb, setAsb] = useState(10000);
          const [th, setTh] = useState(10000);
          const [unitTrust, setUnitTrust] = useState(5000);
          const [tunai, setTunai] = useState(20000);
          const [kwsp, setKwsp] = useState(80000);
          const [emas, setEmas] = useState(5000);
          const [rumahValue, setRumahValue] = useState(350000);
          const [keretaValue, setKeretaValue] = useState(60000);
          
          // === STATE LIABILITI (d'DEBT) ===
          const [debtsList, setDebtsList] = useState([
            { id: 1, name: 'Kad Kredit', balance: 5000, interest: 15, minPayment: 250 },
            { id: 2, name: 'Pinjaman Peribadi', balance: 15000, interest: 6.5, minPayment: 350 },
            { id: 3, name: 'Kereta', balance: 45000, interest: 3.2, minPayment: 550 }
          ]);
          const [extraBudget, setExtraBudget] = useState(300);
          const [debtStrategy, setDebtStrategy] = useState('snowball');
          const [consolRate, setConsolRate] = useState(4.5);
          const [consolYear, setConsolYear] = useState(7);

          // === STATE UNJURAN MASA DEPAN ===
          const [retireAge, setRetireAge] = useState(60);
          const [lifeExpectancy, setLifeExpectancy] = useState(80);
          const [inflationRate, setInflationRate] = useState(3);
          const [assetReturnRate, setAssetReturnRate] = useState(5);
          const [uniAge, setUniAge] = useState(18);
          const [currentEduCost, setCurrentEduCost] = useState(50000);

const [sspnFund, setSspnFund] = useState(5000);
const [asbAnakFund, setAsbAnakFund] = useState(5000);
const [educationInflation, setEducationInflation] = useState(6);
const [universityType, setUniversityType] = useState('local');


          // === STATE SENARIO MATI & PELINDUNG ===
          const [funeralCost, setFuneralCost] = useState(2000);
          const [sepencarianPercent, setSepencarianPercent] = useState(50); 
          const [wasiatPercent, setWasiatPercent] = useState(0); 
          const [hasSpouse, setHasSpouse] = useState(true);
          const [hasMother, setHasMother] = useState(false);
          const [hasFather, setHasFather] = useState(false); 
          const [currentTakaful, setCurrentTakaful] = useState(100000);

          // === DERIVED VARIABLES (PENGIRAAN AUTOMATIK KESELURUHAN) ===
          const numSons = childrenData.filter(c => c.gender === 'lelaki').length;
          const numDaughters = childrenData.filter(c => c.gender === 'perempuan').length;
          const spouseGender = userGender === 'lelaki' ? 'isteri' : 'suami';
          
          const annualIncome = (gajiHakiki + pendapatanSampingan) * 12;

          // --- ANALISIS DSR & HUTANG (d'DEBT Core Logic) ---
          const debtAnalysisResult = useMemo(() => {
              const totalIncome = gajiHakiki + pendapatanSampingan;
              const totalCommitment = debtsList.reduce((sum, d) => sum + d.minPayment, 0);
              const totalBalance = debtsList.reduce((sum, d) => sum + d.balance, 0);
              const dsr = totalIncome > 0 ? (totalCommitment / totalIncome) * 100 : 0;

              let sortedDebts = [...debtsList];
              if (debtStrategy === 'snowball') sortedDebts.sort((a, b) => a.balance - b.balance);
              else if (debtStrategy === 'avalanche') sortedDebts.sort((a, b) => b.interest - a.interest);

              let totalInterestPaid = 0;
              let currentMonth = 0;
              const MAX_MONTHS = 1200;
              let simDebts = sortedDebts.map(d => ({ ...d, currentBalance: d.balance, monthsToFinish: 0 }));
              
              let balanceAtRetirement = 0;
              const retirementMonth = Math.max(0, (retireAge - age) * 12);

              if (debtStrategy !== 'consolidation') {
                  while (simDebts.some(d => d.currentBalance > 0) && currentMonth < MAX_MONTHS) {
                      // Rekod hutang tersisa pada bulan persaraan
                      if (currentMonth === retirementMonth) {
                          balanceAtRetirement = simDebts.reduce((sum, d) => sum + Math.max(0, d.currentBalance), 0);
                      }

                       if (
  balanceAtRetirement === 0 &&
  currentMonth >= retirementMonth
) {

  balanceAtRetirement =
    simDebts.reduce(
      (sum, d) =>
        sum + Math.max(0, d.currentBalance),
      0
    );
}
                      
                      currentMonth++;
                      let monthlyExtraAvailable = extraBudget;

                      for (let d of simDebts) {
                          if (d.currentBalance <= 0) continue;
                          let monthlyRate = (d.interest / 100) / 12;
                          let interestCharged = d.currentBalance * monthlyRate;
                          totalInterestPaid += interestCharged;
                          d.currentBalance += interestCharged;

                          let pay = Math.min(d.currentBalance, d.minPayment);
                          d.currentBalance -= pay;

                          if (d.currentBalance <= 0.01) {
                              d.currentBalance = 0;
                              if (d.monthsToFinish === 0) d.monthsToFinish = currentMonth;
                          }
                      }

                      let freedUpMinPayments = simDebts.filter(d => d.currentBalance === 0).reduce((sum, d) => sum + d.minPayment, 0);
                      monthlyExtraAvailable += freedUpMinPayments;

                      for (let d of simDebts) {
                          if (d.currentBalance > 0) {
                              let extraPay = Math.min(d.currentBalance, monthlyExtraAvailable);
                              d.currentBalance -= extraPay;
                              monthlyExtraAvailable -= extraPay;
                              
                              if (d.currentBalance <= 0.01) {
                                  d.currentBalance = 0;
                                  if (d.monthsToFinish === 0) d.monthsToFinish = currentMonth;
                              }
                              if (monthlyExtraAvailable <= 0) break;
                          }
                      }
                  }
                  
                  // Semakan akhir unjuran persaraan
                  if (currentMonth <= retirementMonth && balanceAtRetirement === 0 && simDebts.every(d => d.currentBalance === 0)) {
                      balanceAtRetirement = 0; 
                  } else if (currentMonth > retirementMonth && balanceAtRetirement === 0) {
                      balanceAtRetirement = simDebts.reduce((sum, d) => sum + d.currentBalance, 0);
                  }
              } else {
                  // Consolidation logic (Flat Rate Assumption)
                  const totalInterestConsol = totalBalance * (consolRate / 100) * consolYear;
                  const totalLoanConsol = totalBalance + totalInterestConsol;
                  const newMonthlyConsol = consolYear > 0 ? totalLoanConsol / (consolYear * 12) : 0;
                  const savingsConsol = totalCommitment - newMonthlyConsol;
                  
                  if (retirementMonth >= consolYear * 12) {
                      balanceAtRetirement = 0;
                  } else {
                      const remainingMonths = (consolYear * 12) - retirementMonth;
                      balanceAtRetirement = (remainingMonths / (consolYear * 12)) * totalBalance; 
                  }

                  return {
                      totalIncome, totalCommitment, totalBalance, dsr,
                      payoffMonths: consolYear * 12,
                      payoffInterest: totalInterestConsol,
                      payoffDetails: [],
                      consolNewMonthly: newMonthlyConsol,
                      consolSavings: savingsConsol,
                      balanceAtRetirement
                  };
              }

              return {
                  totalIncome, totalCommitment, totalBalance, dsr,
                  payoffMonths: currentMonth,
                  payoffInterest: totalInterestPaid,
                  payoffDetails: simDebts,
                  consolNewMonthly: 0,
                  consolSavings: 0,
                  balanceAtRetirement
              };
          }, [debtsList, gajiHakiki, pendapatanSampingan, extraBudget, debtStrategy, consolRate, consolYear, retireAge, age]);

const totalIncomeMonthly = gajiHakiki + pendapatanSampingan;

const kwspAmount = gajiHakiki * (kwspPotongan / 100);

const netIncomeMonthly =
  totalIncomeMonthly -
  kwspAmount -
  socsoPotongan;

const currentMonthlyExpenses =
  dapurExpenses +
  utilitiExpenses +
  transportExpenses +
  entertainmentExpenses +
  insuranceExpenses;

const totalMonthlyCommitments =
  debtAnalysisResult.totalCommitment +
  currentMonthlyExpenses;

const monthlyBalance =
  netIncomeMonthly - totalMonthlyCommitments;





          const totalDebts = debtAnalysisResult.totalBalance;
          const unjuranTotalDebts = debtAnalysisResult.balanceAtRetirement;

          const totalLiquidAssets = asb + th + unitTrust + tunai + kwsp + emas;
          const totalPhysicalAssets = rumahValue + keretaValue;
          const currentNetWorth = (totalLiquidAssets + totalPhysicalAssets) - totalDebts;

          const yearsToRetire = Math.max(0, retireAge - age);
          const yearsInRetirement = Math.max(0, lifeExpectancy - retireAge);
          
          const futureMonthlyExpenses = currentMonthlyExpenses * Math.pow(1 + (inflationRate / 100), yearsToRetire);
          const yearlyRetirementExpense = futureMonthlyExpenses * 12;
          const netReturnRate = (assetReturnRate - inflationRate) / 100;

          const retirementCorpusNeeded = netReturnRate === 0
            ? yearlyRetirementExpense * yearsInRetirement
            : yearlyRetirementExpense * (
                (1 - Math.pow(1 + netReturnRate, -yearsInRetirement)) / netReturnRate
              );
          
 
const totalEducationFundNow =
  sspnFund +
  asbAnakFund;

const futureEduCostTotal =
  childrenData.reduce((total, child) => {

    const yearsToUni =
      Math.max(0, uniAge - child.age);

    // multiplier university
    const adjustedCost =
      universityType === 'overseas'
        ? currentEduCost * 5
        : currentEduCost;

    const futureCost =
      adjustedCost *
      Math.pow(
        1 + (educationInflation / 100),
        yearsToUni
      );

    return total + futureCost;

  }, 0);

const earliestChildYears = childrenData.length > 0
  ? Math.min(
      ...childrenData.map(
        child => Math.max(0, uniAge - child.age)
      )
    )
  : 0;

const futureEducationFund =
  totalEducationFundNow *
  Math.pow(
    1 + (assetReturnRate / 100),
    earliestChildYears
  );

const educationShortfall =
  Math.max(
    0,
    futureEduCostTotal - futureEducationFund
  );

const monthsToUniversity =
  Math.max(1, earliestChildYears * 12);

const educationCatchupMonthly =
  Number.isFinite(educationShortfall)
    ? educationShortfall /
      monthsToUniversity
    : 0;

          const futureLiquidAssets = totalLiquidAssets * Math.pow(1 + (assetReturnRate / 100), yearsToRetire);

// Tolak dana pendidikan anak dahulu
const futureAssetsAfterEducation =
  Math.max(
    0,
    futureLiquidAssets - futureEduCostTotal
  );

          const bakiUntukBersara = Math.max(
  0,
  futureAssetsAfterEducation -
  unjuranTotalDebts
);
          
          const yearsItWillLast =
  yearlyRetirementExpense > 0
    ? bakiUntukBersara /
      yearlyRetirementExpense
    : 0;
          const exhaustAge = retireAge + yearsItWillLast;

          const totalFutureNeeds = unjuranTotalDebts + futureEduCostTotal + retirementCorpusNeeded;
          const retirementShortfall =
  Math.max(
    0,
    (
      unjuranTotalDebts +
      retirementCorpusNeeded
    ) - futureAssetsAfterEducation
  );

let financialScore = 0;

// CASHFLOW
if (monthlyBalance >= 3000)
  financialScore += 25;
else if (monthlyBalance >= 1500)
  financialScore += 20;
else if (monthlyBalance >= 500)
  financialScore += 10;
else if (monthlyBalance >= 0)
  financialScore += 5;
else
  financialScore -= 20;

// DSR
if (debtAnalysisResult.totalCommitment <= 0)
  financialScore += 25;
else if (debtAnalysisResult.dsr <= 35)
  financialScore += 20;
else if (debtAnalysisResult.dsr <= 55)
  financialScore += 10;
else if (debtAnalysisResult.dsr <= 70)
  financialScore -= 10;
else
  financialScore -= 25;

// EMERGENCY FUND
const emergencyMonths =
  currentMonthlyExpenses > 0
    ? tunai / currentMonthlyExpenses
    : 0;

if (emergencyMonths >= 6)
  financialScore += 20;
else if (emergencyMonths >= 3)
  financialScore += 10;
else
  financialScore -= 10;

// RETIREMENT
if (retirementShortfall <= 0)
  financialScore += 20;
else if (retirementShortfall <= 200000)
  financialScore += 10;
else
  financialScore -= 15;

// HARD CAP
financialScore = Math.max(
  0,
  Math.min(100, financialScore)
);

const financialStatus =
  financialScore >= 80 ? 'Sangat Sihat' :
  financialScore >= 60 ? 'Sederhana' :
  financialScore >= 40 ? 'Berisiko' :
  'Kritikal';

          const monthsToRetire =
  Math.max(1, yearsToRetire * 12);

const extraSavingsNeeded =
  Number.isFinite(retirementShortfall)
    ? retirementShortfall / monthsToRetire
    : 0;
          const sustainableMonthlyExpense = yearsInRetirement > 0 ? (bakiUntukBersara / (yearsInRetirement * 12)) : 0;

          // --- PENGIRAAN FARAID & PENYUCIAN HARTA ---
          const totalZakatable = asb + th + unitTrust + tunai + emas; 
          const zakatPayable = totalZakatable * 0.025;

          const grossEstate = totalLiquidAssets + totalPhysicalAssets;
          const estateAfterFuneral = grossEstate - funeralCost;
          const sepencarianAmount = hasSpouse ? (totalPhysicalAssets * (sepencarianPercent / 100)) : 0;
          const estateAfterSepencarian = estateAfterFuneral - sepencarianAmount;
          const estateAfterDebts = estateAfterSepencarian - totalDebts - zakatPayable; 
          const actualNetEstate = Math.max(0, estateAfterDebts);
          const wasiatAmount = actualNetEstate * (Math.min(wasiatPercent, 33.33) / 100);
          const faraidPool = actualNetEstate - wasiatAmount;

          const calculateFaraid = () => {
            let distribution = [];
            let pool = faraidPool;
            if (pool <= 0) return [];

            let spouseShare = 0; let motherShare = 0; let fatherShare = 0; let daughtersShare = 0;
            
            if (hasSpouse) {
              if (spouseGender === 'isteri') {
                spouseShare = (numSons > 0 || numDaughters > 0) ? 1/8 : 1/4;
                distribution.push({ name: 'Isteri', amount: pool * spouseShare, percent: spouseShare * 100, isSpouse: true });
              } else {
                spouseShare = (numSons > 0 || numDaughters > 0) ? 1/4 : 1/2;
                distribution.push({ name: 'Suami', amount: pool * spouseShare, percent: spouseShare * 100, isSpouse: true });
              }
            }

            // ======================
// IBU
// ======================

if (hasMother) {

  motherShare =
    (numSons > 0 || numDaughters > 0)
      ? 1/6
      : 1/3;

  distribution.push({
    name: 'Ibu',
    amount: pool * motherShare,
    percent: motherShare * 100
  });
}

// ======================
// BAPA
// ======================

if (hasFather) {

  fatherShare =
    (numSons > 0 || numDaughters > 0)
      ? 1/6
      : 0;

  distribution.push({
    name: 'Bapa',
    amount: pool * fatherShare,
    percent: fatherShare * 100
  });
}

            if (numSons === 0 && numDaughters > 0) {
              daughtersShare = numDaughters === 1 ? 1/2 : 2/3;
              distribution.push({ name: `Anak Perempuan (${numDaughters} orang)`, amount: pool * daughtersShare, percent: daughtersShare * 100 });
            }

            let allocatedFraction = spouseShare + motherShare + fatherShare + daughtersShare;
            
            if (allocatedFraction > 1) {
              distribution = distribution.map(d => {
                let newFraction = (d.percent / 100) / allocatedFraction;
                return { ...d, amount: pool * newFraction, percent: newFraction * 100 };
              });
              allocatedFraction = 1;
            }

            let remainingFraction = 1 - allocatedFraction;
            let remainingAmount = pool * remainingFraction;

            if (remainingFraction > 0.0001) {
              if (numSons > 0) {
                const totalParts = (numSons * 2) + numDaughters;
                const valuePerPart = remainingAmount / totalParts;
                distribution.push({ name: `Anak Lelaki (${numSons} orang)`, amount: valuePerPart * 2 * numSons, percent: (valuePerPart * 2 * numSons / pool) * 100 });
                if (numDaughters > 0) {
                  distribution.push({ name: `Anak Perempuan (${numDaughters} orang)`, amount: valuePerPart * numDaughters, percent: (valuePerPart * numDaughters / pool) * 100 });
                }
              } else if (hasFather) {
                let fatherIndex = distribution.findIndex(d => d.name === 'Bapa');
                if(fatherIndex !== -1) {
                    distribution[fatherIndex].amount += remainingAmount;
                    distribution[fatherIndex].percent += (remainingFraction * 100);
                    distribution[fatherIndex].name = 'Bapa (Fardu + Asabah)';
                } else {
                    distribution.push({ name: 'Bapa (Asabah)', amount: remainingAmount, percent: remainingFraction * 100 });
                }
              } else {
                distribution.push({ name: 'Baitulmal / Waris Lain (Adik Beradik)', amount: remainingAmount, percent: remainingFraction * 100 });
              }
            }

            return distribution;
          };

          const faraidDistribution = calculateFaraid();

          const spouseFaraidObj = faraidDistribution.find(d => d.isSpouse);
          const spouseFaraidAmount = spouseFaraidObj ? spouseFaraidObj.amount : 0;
          
          const totalSpouseSurvivalFund = sepencarianAmount + spouseFaraidAmount + currentTakaful;
          const familySurvivalNeeds =
  futureMonthlyExpenses *
  12 *
  Math.min(
    10,
    Math.max(5, childrenData.length * 2)
  );
          const incomeProtectionGap = Math.max(0, familySurvivalNeeds - totalSpouseSurvivalFund);

          // --- SUSUNAN TAB BAHARU ---
          const tabs = [
            { id: 1, title: 'Profil', icon: User, desc: 'Diri & Keluarga' },
            { id: 2, title: 'Aset', icon: Landmark, desc: 'Harta Semasa' },
            { id: 3, title: 'Liabiliti', icon: CreditCard, desc: 'DSR & Input Hutang' },
            { id: 4, title: 'Unjuran', icon: TrendingUp, desc: 'Persaraan & Masa Depan' },
            { id: 5, title: 'Senario Mati', icon: Calculator, desc: 'Wasiat, Faraid & Takaful' },
            { id: 6, title: 'Dashboard', icon: Activity, desc: 'Analisis Keseluruhan' },
          ];

          const formatRM = (val) => new Intl.NumberFormat('ms-MY', { style: 'currency', currency: 'MYR', maximumFractionDigits: 0 }).format(val);
          const faraidColors = ['#10b981', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6', '#14b8a6', '#f97316', '#64748b'];

          // Pembolehubah Carta Bar Harta Bersih

      <strong>
        {formatRM(educationShortfall)}
      </strong>
      {' '}
      dan boleh memberi tekanan kepada
      simpanan persaraan jika tiada
      pelan tambahan diwujudkan.
    </p>

  </div>
)}

                              {/* TAKAFUL */}
                              {incomeProtectionGap > 0 && (
                                <div className="bg-cyan-500/10 border border-cyan-500/20 p-4 rounded-xl">
                                  <p className="font-bold text-cyan-300 mb-1">🛡️ Protection Gap Tinggi</p>
                                  <p className="text-slate-300">
                                    Perlindungan kewangan keluarga masih belum mencukupi.
                                    Pertimbangkan Hibah Takaful untuk kesinambungan hidup waris.
                                  </p>
                                </div>
                              )}

                              {/* EMERGENCY FUND */}
                              {emergencyMonths < 3 && (
                                <div className="bg-yellow-500/10 border border-yellow-500/20 p-4 rounded-xl">
                                  <p className="font-bold text-yellow-300 mb-1">💰 Dana Kecemasan Rendah</p>
                                  <p className="text-slate-300">
                                    Simpanan tunai kecemasan kurang daripada 3 bulan perbelanjaan.
                                  </p>
                                </div>
                              )}
                            </div>
                          </div>

                          {/* ========================= */}
                          {/* RUMUSAN PENDIDIKAN */}
                          {/* ========================= */}
                          <div className={`border p-6 rounded-2xl ${futureEducationFund >= futureEduCostTotal ? 'bg-emerald-500/10 border-emerald-500/20' : 'bg-red-500/10 border-red-500/20'}`}>
                            <h4 className="font-bold text-lg mb-4">🎓 Rumusan Dana Pendidikan Anak</h4>
                            {futureEducationFund >= futureEduCostTotal ? (
                              <>
                                <p className="font-bold text-emerald-300 mb-2">✅ Dana Pendidikan Dijangka Mencukupi</p>
                                <p className="text-slate-300">
                                  Dana pendidikan anak dijangka masih mampu ditanggung tanpa menjejaskan persaraan.
                                </p>
                              </>
                            ) : (
                              <>
                                <p className="font-bold text-red-300 mb-3 text-lg">⚠️ Dana Pendidikan Berisiko Tidak Mencukupi</p>
                                <p className="text-slate-300 mb-5 leading-relaxed">
                                  Dana pendidikan dan persaraan dijangka bertembung jika tiada tindakan tambahan dibuat.
                                </p>
                                <div className="space-y-2 text-sm text-slate-300">
                                  <div className="bg-white/5 p-3 rounded-lg">📌 Tingkatkan simpanan pendidikan bulanan.</div>
                                  <div className="bg-white/5 p-3 rounded-lg">📌 Gunakan SSPN / ASB Anak / dana pelaburan khusus.</div>
                                  <div className="bg-white/5 p-3 rounded-lg">📌 Kurangkan hutang sebelum umur persaraan.</div>
                                  <div className="bg-white/5 p-3 rounded-lg">📌 Tingkatkan aset yang memberi cashflow pasif jangka panjang.</div>
                                </div>
                              </>
                            )}
                          </div>
                        </div>
                      </Card>

                    </div>
                  )}
                </div>



                {/* --- BUTANG NAVIGASI HALAMAN BAWAH --- */}
                <div className="mt-8 flex justify-between items-center border-t border-slate-200 pt-6">
                  {activeTab > 1 ? (
                    <button
                      onClick={handlePrevTab}
                      className="px-6 py-3 bg-white text-slate-600 hover:bg-slate-100 hover:text-slate-800 border border-slate-300 font-bold rounded-xl transition-colors shadow-sm"
                    >
                      Kembali
                    </button>
                  ) : (
                    <div></div> /* Empty div untuk spacing bila butang kembali tiada */
                  )}

                  {activeTab < 6 ? (
                    <button
                      onClick={handleNextTab}
                      className="px-6 py-3 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl flex items-center gap-2 transition-colors shadow-sm ml-auto"
                    >
                      Seterusnya <ArrowRight size={20} />
                    </button>
                  ) : (
                    <div className="flex flex-col md:flex-row gap-3 ml-auto w-full md:w-auto mt-4 md:mt-0">
                      <button
                        onClick={() => {
                          setShowReport(true);
                          window.scrollTo({ top: 0, behavior: 'smooth' });
                        }}
                        className="px-6 py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl flex items-center justify-center gap-2 transition-colors shadow-sm w-full md:w-auto"
                      >
                        <Printer size={20} /> Jana Laporan PDF
                      </button>
                      <button
                        onClick={() => {
                          setActiveTab(1);
                          window.scrollTo({ top: 0, behavior: 'smooth' });
                        }}
                        className="px-6 py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl transition-colors shadow-sm w-full md:w-auto text-center"
                      >
                        Mula Semula
                      </button>
                    </div>
                  )}
                </div>

              </main>
              
              <footer className="max-w-6xl mx-auto mt-12 text-center text-slate-500 text-sm">
                <p>myTADBIR: Membantu anda merancang legasi kewangan dan kelangsungan hidup waris mengikut prinsip Islam.</p>
              </footer>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
