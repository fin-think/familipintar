    <!-- LOGIK APLIKASI (REACT) -->
    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        
        // --- Komponen Ikon ---
        const createIcon = (name) => ({ size = 24, className = '' }) => (
            <i className={`ph ${name} ${className} shrink-0`} style={{ fontSize: size }}></i>
        );

        const User = createIcon('ph-user'); const Landmark = createIcon('ph-bank');
        const Wallet = createIcon('ph-wallet'); const BookOpen = createIcon('ph-book-open');
        const CreditCard = createIcon('ph-credit-card'); const Activity = createIcon('ph-activity');
        const Printer = createIcon('ph-printer'); const MessageCircle = createIcon('ph-whatsapp-logo'); 
        const Heart = createIcon('ph-heart'); const Users = createIcon('ph-users');
        const TrendingUp = createIcon('ph-trend-up'); const Calculator = createIcon('ph-calculator');
        const ShieldCheck = createIcon('ph-shield-check'); const PieChart = createIcon('ph-chart-pie');
        const HeartHandshake = createIcon('ph-handshake'); const AlertTriangle = createIcon('ph-warning');
        const FileText = createIcon('ph-file-text'); const CloudArrowUp = createIcon('ph-cloud-arrow-up');

        const Card = ({ children, className = '' }) => (
          <div className={`bg-white rounded-xl shadow-sm border border-slate-200 p-6 ${className}`}>{children}</div>
        );

       const Input = ({ label, value, onChange, prefix = '', suffix = '', disabled=false, className="" }) => {
          const [isFocused, setIsFocused] = React.useState(false);

          // Jika sedang ditaip, tunjuk nombor asal. Jika tidak, format ada koma.
          const displayValue = isFocused 
            ? (value === 0 ? '' : value) 
            : (value === 0 ? '' : new Intl.NumberFormat('en-MY').format(value));

          return (
            <div className={`flex flex-col mb-4 ${className}`}>
              <label className="text-sm font-semibold text-slate-700 mb-1">{label}</label>
              <div className="relative flex items-center">
                {prefix && <span className="absolute left-3 text-slate-500 font-semibold">{prefix}</span>}
                <input
                  type={isFocused ? 'number' : 'text'}
                  value={displayValue}
                  onChange={(e) => {
                    // Buang koma jika ada sebelum diproses oleh sistem
                    const raw = e.target.value.replace(/,/g, '');
                    onChange({ target: { value: raw } });
                  }}
                  onFocus={() => setIsFocused(true)}
                  onBlur={() => setIsFocused(false)}
                  disabled={disabled}
                  placeholder="0"
                  className={`w-full border border-slate-300 rounded-lg py-2 outline-none focus:ring-2 focus:ring-sky-500 transition-all ${prefix ? 'pl-9' : 'pl-3'} ${suffix ? 'pr-8' : 'pr-3'} ${disabled ? 'bg-slate-100 text-slate-500' : 'bg-white'}`}
                />
                {suffix && <span className="absolute right-3 text-slate-500 font-semibold">{suffix}</span>}
              </div>
            </div>
          );
        };

        const SectionHeader = ({ title, icon: Icon, description }) => (
          <div className="mb-6 border-b border-sky-100 pb-4 flex items-center gap-3">
            <div className="p-2 bg-sky-100 text-sky-700 rounded-lg"><Icon size={24} /></div>
            <div>
              <h2 className="text-xl font-bold text-slate-800">{title}</h2>
              <p className="text-sm text-slate-500">{description}</p>
            </div>
          </div>
        );

        const SimplePieChart = ({ data, colors }) => {
          let cumulativePercent = 0;
          const getCoords = (p) => [Math.cos(2 * Math.PI * p), Math.sin(2 * Math.PI * p)];
          if (!data || data.length === 0 || data.every(d => d.percent <= 0)) return <div className="w-full h-full rounded-full bg-slate-200 flex items-center justify-center text-xs text-slate-500">Tiada Data</div>;
          return (
            <svg viewBox="-1 -1 2 2" className="w-full h-full drop-shadow-md" style={{ transform: 'rotate(-90deg)' }}>
              {data.map((slice, i) => {
                if (slice.percent <= 0) return null;
                if (slice.percent >= 99.9) return <circle cx="0" cy="0" r="1" fill={colors[i % colors.length]} key={i} />;
                const [startX, startY] = getCoords(cumulativePercent / 100);
                cumulativePercent += slice.percent;
                const [endX, endY] = getCoords(cumulativePercent / 100);
                const largeArcFlag = slice.percent > 50 ? 1 : 0;
                return <path d={`M ${startX} ${startY} A 1 1 0 ${largeArcFlag} 1 ${endX} ${endY} L 0 0`} fill={colors[i % colors.length]} key={i} />
              })}
            </svg>
          )
        };

        const defaultData = {
          userGender: 'lelaki', age: 30, gajiHakiki: 0, pendapatanSampingan: 0,
          kwspPotongan: 11, socsoPotongan: 0, dapurExpenses: 0, utilitiExpenses: 0,
          transportExpenses: 0, entertainmentExpenses: 0, insuranceExpenses: 0,
          childrenData: [], asb: 0, th: 0, unitTrust: 0, tunai: 0, kwsp: 0, emas: 0,
          rumahValue: 0, keretaValue: 0, debtsList: [], extraBudget: 0, debtStrategy: 'snowball', consolRate: 4.5, consolYear: 7,
          retireAge: 60, lifeExpectancy: 80, inflationRate: 3, assetReturnRate: 5, uniAge: 18, currentEduCost: 50000,
          sspnFund: 0, asbAnakFund: 0, educationInflation: 6, universityType: 'local', funeralCost: 2000, sepencarianPercent: 50,
          wasiatPercent: 0, hasSpouse: false, hasMother: false, hasFather: false, currentTakaful: 0
        };

        function App() {
          const [isFirebaseReady, setIsFirebaseReady] = useState(!!window.fbAuth);
          const [user, setUser] = useState(null);
          const [loadingData, setLoadingData] = useState(true);
          const [isSaving, setIsSaving] = useState(false);
          
          const [activeTab, setActiveTab] = useState(1);
          const [showReport, setShowReport] = useState(false);
          
          const [appData, setAppData] = useState(defaultData);

          // PENGURUSAN AUTENTIKASI & PANGKALAN DATA
          useEffect(() => {
              const handleFbReady = () => setIsFirebaseReady(true);
              window.addEventListener('firebaseLoaded', handleFbReady);
              if (window.fbAuth) setIsFirebaseReady(true);
              return () => window.removeEventListener('firebaseLoaded', handleFbReady);
          }, []);

          useEffect(() => {
              if (!isFirebaseReady) return;
              const unsubscribe = window.fbOnAuth(window.fbAuth, async (u) => {
                  if (u) {
                      setUser(u);
                      await fetchEcosystemData(u.uid);
                  } else {
                      setUser(null);
                      setLoadingData(false);
                  }
              });
              return () => unsubscribe();
          }, [isFirebaseReady]);

          // ENJIN PENYEDUT DATA BERSEPADU (myNasab -> myTADBIR)
          const fetchEcosystemData = async (uid) => {
              try {
                  const docRef = window.fbDoc(window.fbDb, "mytadbir_profiles", uid);
                  const docSnap = await window.fbGetDoc(docRef);
                  let mergedData = { ...defaultData };
                  
                  if (docSnap.exists()) {
                      mergedData = { ...mergedData, ...docSnap.data().raw_data };
                  }

                  // Tarik Data myNasab
                  const q = window.fbQuery(window.fbCollection(window.fbDb, "mynasab_nodes"), window.fbWhere("owner_uid", "==", uid));
                  const nasabSnap = await window.fbGetDocs(q);
                  
                  let childrenList = [];
                  let spouse = false, mother = false, father = false;
                  let selfAge = mergedData.age;
                  let selfGender = mergedData.userGender;

                  nasabSnap.forEach(d => {
                      const data = d.data();
                      const rel = (data.relationship || data.hubungan || '').toLowerCase().trim();
                      const status = (data.status || '').toLowerCase().trim();
                      
                      // 1. Kenal pasti jika sudah meninggal dunia / mertua
                      const isMeninggal = status === 'meninggal' || status === 'meninggal dunia';
                      const isMertua = rel.includes('mertua') || rel.includes('mentua');
                      
                      // 2. Fungsi Kira Umur Tepat
                      const calcAge = (dobStr) => {
                          if (!dobStr) return 0;
                          const birthDate = new Date(dobStr);
                          const today = new Date();
                          let calc = today.getFullYear() - birthDate.getFullYear();
                          const m = today.getMonth() - birthDate.getMonth();
                          if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                              calc--;
                          }
                          return calc;
                      };

                      // 3. 🛡️ PENAPIS JANTINA KEBAL (Berdasarkan Database: "L" atau "P")
                      let jantinaDikesan = 'lelaki'; // Default
                      const gText = (data.gender || data.jantina || '').toString().toLowerCase().trim();
                      const nText = (data.name || data.nama || '').toLowerCase();
                      
                      if (gText === 'p' || gText === 'perempuan' || gText === 'female' || gText === 'f') jantinaDikesan = 'perempuan';
                      else if (gText === 'l' || gText === 'lelaki' || gText === 'male' || gText === 'm') jantinaDikesan = 'lelaki';
                      else if (rel.includes('perempuan')) jantinaDikesan = 'perempuan';
                      else if (rel.includes('lelaki')) jantinaDikesan = 'lelaki';
                      else if (nText.includes('binti ')) jantinaDikesan = 'perempuan';

                      // 4. Tangkap Maklumat Induk (Diri Sendiri)
                      if (rel.includes('diri sendiri') || rel.includes('induk')) {
                          selfAge = calcAge(data.dob) || selfAge;
                          selfGender = jantinaDikesan;
                      }
                      
                      // 5. Tangkap Maklumat Anak
                      if (rel.includes('anak') && !rel.includes('saudara') && !isMeninggal) {
                          childrenList.push({
                              id: d.id,
                              name: data.name || data.nama || `Anak ${childrenList.length + 1}`,
                              age: calcAge(data.dob) || 1,
                              gender: jantinaDikesan
                          });
                      }
                      
                      // 6. Tangkap Status Faraid (Pasangan & Ibu Bapa)
                      if (!isMeninggal && !isMertua) {
                          if (rel.includes('suami') || rel.includes('isteri') || rel.includes('pasangan')) spouse = true;
                          if (rel.match(/ibu|mak|mama/)) mother = true;
                          if (rel.match(/ayah|bapa|abah|papa/)) father = true;
                      }
                  });

                  // Susun anak ikut umur (paling tua ke paling muda)
                  childrenList.sort((a, b) => b.age - a.age);

                  // Timpa data dengan maklumat real-time myNasab
                  if(selfAge > 0) mergedData.age = selfAge;
                  mergedData.userGender = selfGender;
                  mergedData.hasSpouse = spouse;
                  mergedData.hasMother = mother;
                  mergedData.hasFather = father;
                  
                  if (childrenList.length > 0) {
                      mergedData.childrenData = childrenList;
                  }

                  setAppData(mergedData);
              } catch (e) {
                  console.error("Ralat memuatkan ekosistem data:", e);
              }
              setLoadingData(false);
          };
            
          const handleLogin = async (e) => {
              e.preventDefault();
              try { await window.fbSignIn(window.fbAuth, e.target.email.value, e.target.password.value); } 
              catch (err) { alert("Log masuk gagal. Sila semak emel & kata laluan."); }
          };

          const {
            userGender, age, gajiHakiki, pendapatanSampingan, kwspPotongan, socsoPotongan,
            dapurExpenses, utilitiExpenses, transportExpenses, entertainmentExpenses, insuranceExpenses, childrenData,
            asb, th, unitTrust, tunai, kwsp, emas, rumahValue, keretaValue, debtsList, extraBudget, debtStrategy, consolRate, consolYear,
            retireAge, lifeExpectancy, inflationRate, assetReturnRate, uniAge, currentEduCost, sspnFund, asbAnakFund, educationInflation, universityType,
            funeralCost, sepencarianPercent, wasiatPercent, hasSpouse, hasMother, hasFather, currentTakaful
          } = appData;

          const updateApp = (key, val) => setAppData(p => ({...p, [key]: val}));
          const toNumber = (v) => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };

          const numSons = childrenData.filter(c => c.gender === 'lelaki').length;
          const numDaughters = childrenData.filter(c => c.gender === 'perempuan').length;
          const spouseGender = userGender === 'lelaki' ? 'isteri' : 'suami';
          const annualIncome = (gajiHakiki + pendapatanSampingan) * 12;

          const debtAnalysisResult = useMemo(() => {
              const totalIncome = gajiHakiki + pendapatanSampingan;
              const totalCommitment = debtsList.reduce((sum, d) => sum + d.minPayment, 0);
              const totalBalance = debtsList.reduce((sum, d) => sum + d.balance, 0);
              const dsr = totalIncome > 0 ? (totalCommitment / totalIncome) * 100 : 0;

              let sortedDebts = [...debtsList];
              if (debtStrategy === 'snowball') sortedDebts.sort((a, b) => a.balance - b.balance);
              else if (debtStrategy === 'avalanche') sortedDebts.sort((a, b) => b.interest - a.interest);

              let totalInterestPaid = 0; let currentMonth = 0; const MAX_MONTHS = 1200;
              let simDebts = sortedDebts.map(d => ({ ...d, currentBalance: d.balance, monthsToFinish: 0 }));
              let balanceAtRetirement = 0; const retirementMonth = Math.max(0, (retireAge - age) * 12);

              if (debtStrategy !== 'consolidation') {
                  while (simDebts.some(d => d.currentBalance > 0) && currentMonth < MAX_MONTHS) {
                      if (currentMonth === retirementMonth) balanceAtRetirement = simDebts.reduce((sum, d) => sum + Math.max(0, d.currentBalance), 0);
                      currentMonth++;
                      let monthlyExtraAvailable = extraBudget;

                      for (let d of simDebts) {
                          if (d.currentBalance <= 0) continue;
                          let interestCharged = d.currentBalance * ((d.interest / 100) / 12);
                          totalInterestPaid += interestCharged; d.currentBalance += interestCharged;
                          d.currentBalance -= Math.min(d.currentBalance, d.minPayment);
                          if (d.currentBalance <= 0.01) { d.currentBalance = 0; if (d.monthsToFinish === 0) d.monthsToFinish = currentMonth; }
                      }

                      monthlyExtraAvailable += simDebts.filter(d => d.currentBalance === 0).reduce((sum, d) => sum + d.minPayment, 0);

                      for (let d of simDebts) {
                          if (d.currentBalance > 0) {
                              let extraPay = Math.min(d.currentBalance, monthlyExtraAvailable);
                              d.currentBalance -= extraPay; monthlyExtraAvailable -= extraPay;
                              if (d.currentBalance <= 0.01) { d.currentBalance = 0; if (d.monthsToFinish === 0) d.monthsToFinish = currentMonth; }
                              if (monthlyExtraAvailable <= 0) break;
                          }
                      }
                  }
                  if (currentMonth > retirementMonth && balanceAtRetirement === 0) balanceAtRetirement = simDebts.reduce((sum, d) => sum + d.currentBalance, 0);
              } else {
                  const totalInterestConsol = totalBalance * (consolRate / 100) * consolYear;
                  const newMonthlyConsol = consolYear > 0 ? (totalBalance + totalInterestConsol) / (consolYear * 12) : 0;
                  balanceAtRetirement = retirementMonth >= consolYear * 12 ? 0 : (((consolYear * 12) - retirementMonth) / (consolYear * 12)) * totalBalance; 
                  return { totalIncome, totalCommitment, totalBalance, dsr, payoffMonths: consolYear * 12, payoffInterest: totalInterestConsol, payoffDetails: [], consolNewMonthly: newMonthlyConsol, consolSavings: totalCommitment - newMonthlyConsol, balanceAtRetirement };
              }

              return { totalIncome, totalCommitment, totalBalance, dsr, payoffMonths: currentMonth, payoffInterest: totalInterestPaid, payoffDetails: simDebts, consolNewMonthly: 0, consolSavings: 0, balanceAtRetirement };
          }, [debtsList, gajiHakiki, pendapatanSampingan, extraBudget, debtStrategy, consolRate, consolYear, retireAge, age]);

          const totalIncomeMonthly = gajiHakiki + pendapatanSampingan;
          const netIncomeMonthly = totalIncomeMonthly - (gajiHakiki * (kwspPotongan / 100)) - socsoPotongan;
          const currentMonthlyExpenses = dapurExpenses + utilitiExpenses + transportExpenses + entertainmentExpenses + insuranceExpenses;
          const totalMonthlyCommitments = debtAnalysisResult.totalCommitment + currentMonthlyExpenses;
          const monthlyBalance = netIncomeMonthly - totalMonthlyCommitments;

          const totalDebts = debtAnalysisResult.totalBalance;
          const unjuranTotalDebts = debtAnalysisResult.balanceAtRetirement;
          const totalLiquidAssets = asb + th + unitTrust + tunai + kwsp + emas;
          const totalPhysicalAssets = rumahValue + keretaValue;
          const currentNetWorth = (totalLiquidAssets + totalPhysicalAssets) - totalDebts;

          const yearsToRetire = Math.max(0, retireAge - age);
          const yearsInRetirement = Math.max(0, lifeExpectancy - retireAge);
          const yearlyRetirementExpense = currentMonthlyExpenses * Math.pow(1 + (inflationRate / 100), yearsToRetire) * 12;
          const netReturnRate = (assetReturnRate - inflationRate) / 100;

          const retirementCorpusNeeded = netReturnRate === 0 ? yearlyRetirementExpense * yearsInRetirement : yearlyRetirementExpense * ((1 - Math.pow(1 + netReturnRate, -yearsInRetirement)) / netReturnRate);
          const futureEduCostTotal = childrenData.reduce((total, child) => total + ((universityType === 'overseas' ? currentEduCost * 5 : currentEduCost) * Math.pow(1 + (educationInflation / 100), Math.max(0, uniAge - child.age))), 0);
          const futureEducationFund = (sspnFund + asbAnakFund) * Math.pow(1 + (assetReturnRate / 100), childrenData.length > 0 ? Math.min(...childrenData.map(c => Math.max(0, uniAge - c.age))) : 0);
          const educationShortfall = Math.max(0, futureEduCostTotal - futureEducationFund);

          const futureLiquidAssets = totalLiquidAssets * Math.pow(1 + (assetReturnRate / 100), yearsToRetire);
          const bakiUntukBersara = Math.max(0, Math.max(0, futureLiquidAssets - futureEduCostTotal) - unjuranTotalDebts);
          const yearsItWillLast = yearlyRetirementExpense > 0 ? bakiUntukBersara / yearlyRetirementExpense : 0;
          const exhaustAge = retireAge + yearsItWillLast;
          const retirementShortfall = Math.max(0, (unjuranTotalDebts + retirementCorpusNeeded) - Math.max(0, futureLiquidAssets - futureEduCostTotal));

          let financialScore = 50;
          if (monthlyBalance >= 1500) financialScore += 20; else if (monthlyBalance < 0) financialScore -= 20;
          if (debtAnalysisResult.dsr <= 35) financialScore += 20; else if (debtAnalysisResult.dsr > 70) financialScore -= 25;
          if ((currentMonthlyExpenses > 0 ? tunai / currentMonthlyExpenses : 0) >= 3) financialScore += 10;
          financialScore = Math.max(0, Math.min(100, financialScore));
          const financialStatus = financialScore >= 80 ? 'Sangat Sihat' : financialScore >= 60 ? 'Sederhana' : financialScore >= 40 ? 'Berisiko' : 'Kritikal';

          const totalZakatable = asb + th + unitTrust + tunai + emas; 
          const zakatPayable = totalZakatable * 0.025;
          const actualNetEstate = Math.max(0, (totalLiquidAssets + totalPhysicalAssets) - funeralCost - (hasSpouse ? (totalPhysicalAssets * (sepencarianPercent / 100)) : 0) - totalDebts - zakatPayable);
          const wasiatAmount = actualNetEstate * (Math.min(wasiatPercent, 33.33) / 100);
          const faraidPool = actualNetEstate - wasiatAmount;

          const calculateFaraid = () => {
            let distribution = []; let pool = faraidPool; if (pool <= 0) return [];
            let spouseShare = 0, motherShare = 0, fatherShare = 0, daughtersShare = 0;
            
            if (hasSpouse) {
              spouseShare = spouseGender === 'isteri' ? ((numSons > 0 || numDaughters > 0) ? 1/8 : 1/4) : ((numSons > 0 || numDaughters > 0) ? 1/4 : 1/2);
              distribution.push({ name: spouseGender === 'isteri' ? 'Isteri' : 'Suami', amount: pool * spouseShare, percent: spouseShare * 100, isSpouse: true });
            }
            if (hasMother) { motherShare = (numSons > 0 || numDaughters > 0) ? 1/6 : 1/3; distribution.push({ name: 'Ibu', amount: pool * motherShare, percent: motherShare * 100 }); }
            if (hasFather) { fatherShare = (numSons > 0 || numDaughters > 0) ? 1/6 : 0; distribution.push({ name: 'Bapa', amount: pool * fatherShare, percent: fatherShare * 100 }); }
            if (numSons === 0 && numDaughters > 0) { daughtersShare = numDaughters === 1 ? 1/2 : 2/3; distribution.push({ name: `Anak Perempuan (${numDaughters})`, amount: pool * daughtersShare, percent: daughtersShare * 100 }); }

            let allocatedFraction = spouseShare + motherShare + fatherShare + daughtersShare;
            if (allocatedFraction > 1) {
              distribution = distribution.map(d => ({ ...d, amount: pool * ((d.percent / 100) / allocatedFraction), percent: ((d.percent / 100) / allocatedFraction) * 100 }));
              allocatedFraction = 1;
            }
            let remFraction = 1 - allocatedFraction;
            if (remFraction > 0.0001) {
              if (numSons > 0) {
                const valPerPart = (pool * remFraction) / ((numSons * 2) + numDaughters);
                distribution.push({ name: `Anak Lelaki (${numSons})`, amount: valPerPart * 2 * numSons, percent: ((valPerPart * 2 * numSons) / pool) * 100 });
                if (numDaughters > 0) distribution.push({ name: `Anak Perempuan (${numDaughters})`, amount: valPerPart * numDaughters, percent: ((valPerPart * numDaughters) / pool) * 100 });
              } else if (hasFather) {
                let fIdx = distribution.findIndex(d => d.name === 'Bapa');
                if(fIdx !== -1) { distribution[fIdx].amount += (pool * remFraction); distribution[fIdx].percent += (remFraction * 100); distribution[fIdx].name = 'Bapa (Fardu + Asabah)'; } 
                else distribution.push({ name: 'Bapa (Asabah)', amount: pool * remFraction, percent: remFraction * 100 });
              } else { distribution.push({ name: 'Baitulmal / Waris Lain', amount: pool * remFraction, percent: remFraction * 100 }); }
            }
            return distribution;
          };

          const faraidDistribution = calculateFaraid();

                            <label className="flex items-center gap-3 cursor-pointer p-3 bg-slate-50 rounded-lg border border-slate-200">
                              <input type="checkbox" checked={hasSpouse} onChange={(e) => updateApp('hasSpouse', e.target.checked)} className="accent-sky-600 w-5 h-5" />
                              <span className="font-semibold text-slate-700">Pasangan Hidup</span>
                            </label>
                            <div className="space-y-3">
                              <label className="flex items-center gap-3 text-sm font-medium text-slate-700"><input type="checkbox" checked={hasMother} onChange={e => updateApp('hasMother', e.target.checked)} className="w-4 h-4" /> Ibu Hidup</label>
                              <label className="flex items-center gap-3 text-sm font-medium text-slate-700"><input type="checkbox" checked={hasFather} onChange={e => updateApp('hasFather', e.target.checked)} className="w-4 h-4" /> Bapa Hidup</label>
                            </div>
                          </div>
                        </Card>
                      </div>
                    </div>
                  )}

                  {/* --- TAHAP 6: DASHBOARD & BUTTON SIMPAN --- */}
                  {activeTab === 6 && (
                    <div className="space-y-6 animate-fadeIn">
                      <div className="bg-slate-800 text-white p-6 rounded-xl shadow-md text-center mb-6">
                        <h2 className="text-2xl font-bold mb-2 flex justify-center items-center gap-2"><Activity className="text-sky-400" /> Dashboard Analisis Keseluruhan myTADBIR</h2>
                      </div> 

                      <Card className="bg-gradient-to-br from-slate-900 via-indigo-900 to-slate-800 text-white border-none shadow-xl">
                        <h3 className="text-lg font-bold mb-6">Kedudukan Kewangan Bulanan</h3>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                          <div className="bg-white/5 backdrop-blur-lg border border-white/10 p-5 rounded-xl">
                            <p className="text-sm text-slate-300">Pendapatan Bersih</p><p className="text-3xl font-black text-sky-400">{formatRM(netIncomeMonthly)}</p>
                          </div>
                          <div className="bg-white/5 backdrop-blur-lg border border-white/10 p-5 rounded-xl">
                            <p className="text-sm text-slate-300">Baki Bulanan</p><p className={`text-3xl font-black ${monthlyBalance >= 0 ? 'text-sky-400' : 'text-red-400'}`}>{formatRM(monthlyBalance)}</p>
                          </div>
                          <div className="bg-white/5 backdrop-blur-lg border border-white/10 p-5 rounded-xl">
                            <p className="text-sm text-slate-300">Financial Score</p>
                            <p className={`text-4xl font-black ${financialScore >= 80 ? 'text-sky-400' : financialScore >= 60 ? 'text-yellow-400' : 'text-red-400'}`}>{financialScore}/100</p>
                          </div>
                        </div>
                      </Card>

                      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <Card className="flex flex-col relative overflow-hidden bg-white shadow-sm border border-slate-200">
                          <h3 className="text-lg font-bold text-slate-800 mb-4 border-b pb-2 flex items-center gap-2"><Landmark className="text-sky-600" /> Harta Bersih Semasa (Net Worth)</h3>
                          <div className="flex-1 flex flex-col justify-center mt-2">
                            <p className="text-4xl font-extrabold text-sky-700 mb-4">{formatRM(currentNetWorth)}</p>
                          </div>
                        </Card>
                        <Card className="bg-amber-50 border-amber-200 shadow-sm text-center">
                          <h3 className="text-lg font-bold text-amber-900 mb-4 border-b border-amber-200 pb-2"><HeartHandshake className="text-amber-600 inline mr-2" /> Zakat Wajib (Tunai/Emas)</h3>
                          <p className="text-4xl font-extrabold text-emerald-600">{formatRM(zakatPayable)}</p>
                        </Card>
                      </div>

                      {/* --- BUTANG SIMPAN KE OURMONEY --- */}
                      <div className="mt-12 bg-sky-50 border border-sky-200 p-6 rounded-2xl text-center shadow-sm">
                          <CloudArrowUp size={48} className="mx-auto text-sky-500 mb-3" />
                          <h3 className="text-xl font-bold text-slate-800 mb-2">Simpan & Hubungkan ke OurMoney</h3>
                          <p className="text-slate-600 text-sm mb-6 max-w-lg mx-auto">
                              Simpan profil perancangan myTADBIR anda. Nilai Harta Bersih (Net Worth) dan Unjuran Dana ini akan dipaparkan di aplikasi <strong>OurMoney</strong> secara automatik.
                          </p>
                          <button 
                              onClick={simpanDanSyncKeOurMoney} 
                              disabled={isSaving}
                              className={`px-8 py-4 font-bold text-white rounded-xl shadow-md transition-all ${isSaving ? 'bg-slate-400 cursor-not-allowed' : 'bg-sky-600 hover:bg-sky-700 hover:-translate-y-1'}`}
                          >
                              {isSaving ? "Menyimpan Data..." : "💾 Simpan Profil myTADBIR"}
                          </button>
                      </div>

                    </div>
                  )}

                </div>
              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
