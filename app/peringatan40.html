      { atas: "Dah solat Isyak dan baca Al-Mulk ke? Kalau belum, sekejap lagi buat ya.", bawah: "Dari siang hari sampai jam sekarang, awak ada tersilap cakap atau salah adab yang menyinggung Allah dan saudara Muslim lain? Kalau ada, mohon keampunan, mohon maaf dan maafkan semua ya sebelum tidur. Niatkan esok akan jadi lebih baik, dan doakan diberi rezeki dan umur untuk esok meneruskan perjalanan dunia sebagai bekalan akhirat kelak. InshaAllah awak mampu bangun Tahajud nanti untuk mulakan hari yang baru. Assalamualaikum dan selamat malam." },
      { atas: "Dah solat Isyak? Sebelum tidur, baca Al-Mulk dulu ya, jadi peneman tidur yang tenang.", bawah: "Hari ni awak dah buat yang terbaik dengan apa yang awak ada. Kalau ada yang tak sempurna, serahkan pada Allah dan maafkan diri sendiri. Tidur bukan hukuman, tapi rehat yang Allah beri supaya awak bangkit lebih kuat esok. Letak telefon, tarik nafas, dan tidur dengan hati yang tenang. Selamat malam." },
      { atas: "Hari ni apa yang buat awak senyum? Ingat balik sekejap, lepas tu bersyukur sebelum tidur ya.", bawah: "Cari tiga perkara baik yang berlaku hari ni, sekecil mana pun. Nikmat selalu lalu tanpa kita sedar. Kalau hari ni berat, ucap Alhamdulillah kerana awak tetap sampai ke penghujungnya. Esok ada peluang baru, dan awak layak untuknya. InshaAllah." },
      { atas: "Dah maafkan semua orang hari ni? Jom lepaskan sebelum tidur, supaya hati ringan.", bawah: "Menyimpan marah itu berat dan hanya membebankan awak sendiri. Maafkan yang menyakiti, dan mohon maaf pada yang awak tersakiti. Hati yang bersih tidur lebih lena dan bangun lebih ringan. Doakan kebaikan untuk semua, termasuk diri awak sendiri. Selamat malam." },
      { atas: "Sebelum tidur, jom semak: dah Isyak, dah Al-Mulk, dah niat esok nak jadi lebih baik?", bawah: "Esok bukan tentang menjadi sempurna, tapi menjadi sedikit lebih baik daripada hari ni. Pilih satu perkara kecil untuk diperbaiki: lebih sabar dengan keluarga, lebih awal solat, lebih rajin senyum. Perubahan besar bermula dengan langkah kecil yang konsisten. InshaAllah awak mampu." },
      { atas: "Penat hari ni? Tak apa. Jom serahkan semuanya pada Allah sebelum tidur.", bawah: "Tak semua perkara dalam kawalan kita, dan itu okay. Bahagian kita ialah usaha dan doa, selebihnya Allah yang uruskan, dan Dia sebaik-baik pengurus urusan. Lepaskan beban yang awak bawa hari ni. Awak tak sendiri, ada keluarga dan ada Allah. Tidurlah dengan tenang." },
      { atas: "Dah baca doa tidur dan Al-Mulk? Jom tutup hari ni dengan baik ya.", bawah: "Setiap hari yang berlalu ialah satu bab dalam cerita hidup awak. Bab hari ni dah tamat, jadi tutup dengan istighfar dan syukur. Kalau ada yang masih terbuku, ceritakan pada Allah, Dia sentiasa mendengar. Doakan umur yang berkat, rezeki yang halal, dan keluarga yang sentiasa dalam lindungan-Nya. Assalamualaikum dan selamat malam." }
    ] }
};

const q = new URLSearchParams(location.search);
let jam = parseInt(q.get('jam'), 10);
if (jam !== 20 && jam !== 22) jam = (new Date().getHours() >= 21 || new Date().getHours() < 5) ? 22 : 20;
const per = q.get('per') === 'pasangan' ? 'pasangan' : 'induk';
const id = q.get('i');
const $ = (x) => document.getElementById(x);

$('utama').className = 'utama j' + jam;
$('u-kecil').textContent = TAJUK[jam];
$('btn-buka').href = '/app/mychecklist40.html';

// Ayat daripada notifikasi dipaparkan serta-merta (tanpa perlu log masuk)
if (id && AYAT[id]) { $('u-ayat').textContent = AYAT[id][1]; $('u-tajuk').textContent = AYAT[id][0]; }
else { $('u-ayat').textContent = 'Semak amalan anda hari ini dan tandakan yang telah dilakukan.'; }

// ===== Peringatan anak (6 pagi, 6 petang, 9 malam): isi dikira daripada umur, jantina dan status ibu bapa pada pautan =====
function ayatAnak() {
  const slot = ['pagi', 'petang', 'malam'].indexOf(q.get('slot')) >= 0 ? q.get('slot') : 'pagi';
  const nama = (q.get('n') || 'anak').slice(0, 30), umur = parseInt(q.get('u'), 10) || 7, P = q.get('j') === 'P';
  const ok = (v) => (v || '').split(',').filter(function (x) { return ['ayah', 'ibu', 'ibu bapa'].indexOf(x) >= 0; });
  let hidup = ok(q.get('h')); const arwah = ok(q.get('a'));
  if (!hidup.length && !arwah.length) hidup = ['ibu bapa'];
  const sbg = (a) => a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' dan ' + a[a.length - 1];
  const hari = Math.floor(Date.now() / 86400000), v = hari % 3;
  const soleh = P ? 'solehah' : 'soleh';
  const H = sbg(hidup) || 'ibu bapa', A = sbg(arwah);
  const alFatihah = arwah.length ? ['Al-Fatihah untuk arwah ' + A, 'Sedekahkan Al-Fatihah untuk arwah ' + A + ' dan doakan semoga ' + (arwah.length > 1 || arwah[0] === 'ibu bapa' ? 'mereka' : 'beliau') + ' tenang di sana.'] : null;
  if (slot === 'pagi') {
    const kerja = umur >= 18;
    const nasihat = kerja
      ? ['Kerja elok-elok dan amanah. Rezeki halal itu berkat, dan setiap peluh awak untuk keluarga dikira Allah.', 'Jaga amanah dan adab di tempat kerja. Doa ibu bapa sentiasa mengiringi awak.', 'Buat kerja dengan jujur hari ni. Itu cara awak balas jasa ibu bapa.'][v]
      : ['Belajar bersungguh-sungguh hari ni, hormat cikgu dan dengar nasihat mereka. Ilmu yang berkat itu bekalan awak.', 'Fokus masa belajar dan jangan malu bertanya. Setiap ilmu yang awak dapat membuatkan ibu bapa bangga.', 'Rajin belajar dan jaga solat. Itu hadiah paling indah untuk ibu bapa awak.'][v];
    return { tajuk: '☀️ Selamat pagi, ' + nama, atas: 'Niatkan hari ni nak jadi anak ' + soleh + ' sepanjang hari.', kad: [['Nasihat hari ini', nasihat], ['Niat pagi', 'Ya Allah, jadikan aku anak ' + soleh + ' hari ini, yang taat kepada-Mu dan menjaga hati ibu bapaku. Bantulah aku, InshaAllah aku mampu.']], } ;
  }
  if (slot === 'petang') {
    const k = [['Doakan ibu bapa', 'Bila masuk Maghrib nanti, selesai solat, doakan ' + H + ' awak ya. Doa anak yang soleh dan solehah sampai kepada ibu bapanya.']];
    if (alFatihah) k.push(alFatihah);
    return { tajuk: '🌇 Hari dah nak berakhir', atas: 'Waktu Maghrib hampir tiba. Jangan lupa doakan ibu bapa awak.', kad: k };
  }
  const k = [];
  if (hidup.length) {
    k.push(['Ucap terima kasih', 'Hari ni, pergi pada ' + H + ' dan ucap terima kasih. Ceritakan satu perkara yang mereka dah korbankan untuk awak, contohnya masa, tenaga, wang dan tidur mereka. Biar mereka tahu awak sedar.']);
    k.push(['Ucap sayang', 'Lepas tu, ucap “Saya sayang ' + (hidup.length === 1 && hidup[0] !== 'ibu bapa' ? hidup[0] : 'ibu ayah') + '”. Ceritakan betapa awak rasa disayangi dan apa yang paling awak hargai tentang kasih sayang mereka.']);
  }
  if (alFatihah) k.push(alFatihah);
  return { tajuk: '🌙 Sebelum tidur', atas: hidup.length ? 'Dah ucap terima kasih dan sayang pada ' + H + '? Jom buat sebelum tidur.' : 'Sebelum tidur, sedekahkan Al-Fatihah untuk arwah ' + A + '.', kad: k };
}

const slotM = q.get('slot') === 'malam' ? 'malam' : 'pagi';
if (q.get('mod') === 'anak') {
  const R = ayatAnak();
  $('utama').className = 'utama ' + (q.get('slot') === 'malam' ? 'j22' : 'j20');
  $('u-kecil').textContent = R.tajuk;
  $('u-ayat').textContent = R.atas;
  $('u-tajuk').textContent = '';
  const h = $('hadis'); h.style.display = '';
  h.querySelector('small').textContent = R.kad[0][0];
  $('h-teks').textContent = R.kad[0][1];
  $('h-sumber').textContent = '';
  R.kad.slice(1).forEach(function (kk) {
    const d = document.createElement('div'); d.className = 'hadis';
    const sm = document.createElement('small'); sm.textContent = kk[0];
    const pp = document.createElement('p'); pp.textContent = kk[1];
    d.appendChild(sm); d.appendChild(pp); h.parentNode.insertBefore(d, $('btn-buka'));
  });
  $('btn-buka').style.display = 'none';
} else if (q.get('mod') === 'harijadi') {
  // l = Nama~umur~hubungan,... (hubungan "diri" = penerima sendiri). Semua dipaparkan sebagai teks biasa.
  $('utama').className = 'utama j20';
  $('u-kecil').textContent = '🎂 Hari lahir keluarga';
  const senarai = (q.get('l') || '').split(',').slice(0, 8).map(function (x) { const a = x.split('~'); return { nama: (a[0] || '').slice(0, 40), umur: parseInt(a[1], 10) || 0, hub: (a[2] || '').slice(0, 20) }; }).filter(function (x) { return x.nama; });
  $('u-ayat').textContent = senarai.length ? 'Hari ni ada ' + senarai.length + ' hari lahir dalam keluarga.' : 'Tiada hari lahir hari ini.';
  $('u-tajuk').textContent = '';
  const h = $('hadis'); h.style.display = 'none';
  senarai.forEach(function (x) {
    const d = document.createElement('div'); d.className = 'hadis';
    const sm = document.createElement('small'); sm.textContent = x.hub === 'diri' ? 'Hari lahir awak' : (x.hub || 'Ahli keluarga');
    const pp = document.createElement('p'); pp.textContent = x.nama + (x.umur ? ', ' + x.umur + ' tahun' : '');
    d.appendChild(sm); d.appendChild(pp);
    if (x.hub !== 'diri') {
      const ucap = 'Selamat hari lahir, ' + x.nama.split(' ')[0] + '! Semoga panjang umur, murah rezeki, sihat dan sentiasa dalam lindungan Allah. Aamiin.';
      const a = document.createElement('a'); a.className = 'btn'; a.style.marginTop = '12px'; a.textContent = 'Hantar ucapan di WhatsApp ➔';
      a.href = 'https://wa.me/?text=' + encodeURIComponent(ucap); a.target = '_blank'; a.rel = 'noopener';
      d.appendChild(a);
    }
    h.parentNode.insertBefore(d, $('btn-buka'));
  });
  $('btn-buka').style.display = 'none';
} else if (q.get('mod') === 'muhasabah') {
  const M = MUHASABAH[slotM];
  const hariKe = Math.floor(Date.now() / 86400000), sParam = parseInt(q.get('s'), 10);
  const S = M.set[((Number.isFinite(sParam) && sParam >= 0 ? sParam : hariKe) % M.set.length)];
  $('utama').className = 'utama ' + (slotM === 'malam' ? 'j22' : 'j20');
  $('u-kecil').textContent = M.tajuk;
  $('u-ayat').textContent = S.atas;
  $('u-tajuk').textContent = '';
  $('hadis').querySelector('small').textContent = 'Muhasabah';
  $('h-teks').textContent = S.bawah;
  $('h-sumber').textContent = '';
  $('hadis').style.display = '';
  $('btn-buka').style.display = 'none';      // muhasabah tiada kaitan dengan myCHECKLIST40
} else {
// Hadis ikut perkara; jika tiada parameter, pilih ikut hari
let kunci = id && HADIS[id] ? id : KUMP[jam][Math.floor(Date.now() / 86400000) % KUMP[jam].length];
if (!(id && AYAT[id])) { $('u-ayat').textContent = AYAT[kunci][1]; $('u-tajuk').textContent = AYAT[kunci][0]; }
if (HADIS[kunci]) {
  $('h-teks').textContent = HADIS[kunci][0];
  $('h-sumber').textContent = HADIS[kunci][1];
  $('hadis').style.display = '';
}
}
</script>
</body>
</html>
