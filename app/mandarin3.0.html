            {speaker:'A', cn:'你看到我发的信息了吗？', py:'nǐ kàn dào wǒ fā de xìn xī le ma?', ms:'Dah tengok mesej saya hantar?'},
            {speaker:'B', cn:'对不起，我刚看到。', py:'duì bu qǐ, wǒ gāng kàn dào.', ms:'Maaf, saya baru tengok.'},
            {speaker:'A', cn:'记得回我哦。', py:'jì de huí wǒ ó.', ms:'Ingat balas tau.'}
          ],
          [
            {speaker:'A', cn:'网络很慢，图片发不出去。', py:'wǎng luò hěn màn, tú piàn fā bú chū qù.', ms:'Line lambat, gambar tak boleh hantar.'},
            {speaker:'B', cn:'我也一样，可能是天气的原因。', py:'wǒ yě yí yàng, kě néng shì tiān qì de yuán yīn.', ms:'Saya pun sama, mungkin sebab cuaca.'},
            {speaker:'A', cn:'等下我再试试。', py:'děng xià wǒ zài shì shì.', ms:'Nanti saya cuba lagi.'}
          ],
          [
            {speaker:'A', cn:'我们要不要开个群聊？', py:'wǒ men yào bu yào kāi gè qún liáo?', ms:'Kita nak buka group chat tak?'},
            {speaker:'B', cn:'好啊，把大家都拉进来。', py:'hǎo a, bǎ dà jiā dōu lā jìn lái.', ms:'Boleh, masukkan semua orang.'},
            {speaker:'A', cn:'已经建好了。', py:'yǐ jīng jiàn hǎo le.', ms:'Dah siap buat.'}
          ],
          [
            {speaker:'A', cn:'你刚才发的语音我听不到。', py:'nǐ gāng cái fā de yǔ yīn wǒ tīng bú dào.', ms:'Voice note yang awak hantar tadi saya tak dengar.'},
            {speaker:'B', cn:'那我打字给你吧。', py:'nà wǒ dǎ zì gěi nǐ ba.', ms:'Kalau macam tu saya taip pada awaklah.'},
            {speaker:'A', cn:'好的。', py:'hǎo de.', ms:'Baiklah.'}
          ]
        ]
      },
      festivals: {
        vocab: [
          ['开斋节', 'kāi zhāi jié', 'Hari Raya Puasa'], ['新年', 'xīn nián', 'Tahun Baru'], ['屠妖节', 'tú yāo jié', 'Deepavali'], ['中秋节', 'zhōng qiū jié', 'Pesta Tanglung'],
          ['烟花', 'yān huā', 'Bunga api'], ['灯笼', 'dénom lóng', 'Tanglung'], ['月饼', 'yuè bǐng', 'Kuih bulan'], ['亲戚', 'qīn qi', 'Saudara mara'],
          ['热闹', 'rè nao', 'Meriah'], ['庆祝', 'qìng zhù', 'Raikan'], ['假期', 'jià qī', 'Cuti'], ['家乡', 'jiā xiāng', 'Kampung'],
          ['传统', 'chuán tǒng', 'Tradisi'], ['红包', 'hóng bāo', 'Angpow'], ['聚餐', 'jù cān', 'Makan besar'], ['大扫除', 'dà sǎo chú', 'Gotong-royong'],
          ['新衣服', 'xīn yī fu', 'Baju baru'], ['礼物', 'lǐ wù', 'Hadiah'], ['游行', 'yóu xíng', 'Perarakan'], ['国庆日', 'guó qìng rì', 'Hari Kebangsaan']
        ],
        conversation: [
          [
            {speaker:'A', cn:'开斋节快乐！', py:'kāi zhāi jié kuài lè!', ms:'Selamat Hari Raya!'},
            {speaker:'B', cn:'同乐！你回老家了吗？', py:'tóng lè! nǐ huí lǎo jiā le ma?', ms:'Sama-sama! Kamu balik kampung tak?'},
            {speaker:'A', cn:'回了，家乡很热闹。', py:'huí le, jiā xiāng hěn rè nao.', ms:'Dah balik, kampung sangat meriah.'}
          ],
          [
            {speaker:'A', cn:'华人新年快到了。', py:'huá rén xīn nián kuài dào le.', ms:'Tahun Baru Cina dah nak dekat.'},
            {speaker:'B', cn:'是啊，我们要去买年货。', py:'shì a, wǒ men yào qù mǎi nián huò.', ms:'Ya, kita kena pergi beli barang persiapan raya.'},
            {speaker:'A', cn:'别忘了买红色的衣服。', py:'bié wàng le mǎi hóng sè de yī fu.', ms:'Jangan lupa beli baju warna merah.'}
          ],
          [
            {speaker:'A', cn:'屠妖节你们做什么？', py:'tú yāo jié nǐ men zuò shén me?', ms:'Deepavali kalian buat apa?'},
            {speaker:'B', cn:'我们去亲戚家聚餐。', py:'wǒ men qù qīn qi jiā jù cān.', ms:'Kami pergi rumah saudara untuk makan besar.'},
            {speaker:'A', cn:'祝你们节日快乐。', py:'zhù nǐ men jié rì kuài lè.', ms:'Semoga kalian selamat menyambut perayaan.'}
          ],
          [
            {speaker:'A', cn:'中秋节我们要吃月饼。', py:'zhōng qiū jié wǒ men yào chī yuè bǐng.', ms:'Pesta Tanglung kita kena makan kuih bulan.'},
            {speaker:'B', cn:'还要玩灯笼呢！', py:'hái yào wán dēng lóng ne!', ms:'Dan kena main tanglung juga!'},
            {speaker:'A', cn:'真怀念小时候。', py:'zhēn huái niàn xiǎo shí hou.', ms:'Rindunya zaman kanak-kanak.'}
          ],
          [
            {speaker:'A', cn:'明天是国庆日，有游行。', py:'míng tiān shì guó qìng rì, yǒu yóu xíng.', ms:'Esok Hari Kebangsaan, ada perarakan.'},
            {speaker:'B', cn:'我们要去吉隆坡看吗？', py:'wǒ men yào qù jí lóng pō kàn ma?', ms:'Kita nak ke Kuala Lumpur tengok tak?'},
            {speaker:'A', cn:'好啊，一定很精彩。', py:'hǎo a, yí dìng hěn jīng cǎi.', ms:'Boleh, mesti sangat menarik.'}
          ]
        ]
      }
    };

    const grid = document.getElementById('topic-grid');
    topics.forEach(t => {
      grid.innerHTML += `
        <div class="card-hover cursor-pointer border-2 bg-white rounded-xl p-5 ${t.color} flex flex-col items-center justify-center text-center" onclick="openLesson('${t.id}')">
          <div class="text-4xl mb-2">${t.emoji}</div>
          <h3 class="font-bold text-gray-800 text-lg chinese">${t.cn}</h3>
          <p class="text-xs text-rose-500 font-bold mb-1 italic">${t.py}</p>
          <div class="text-sm font-semibold text-gray-700 mb-1">${t.title}</div>
          <p class="text-[10px] text-gray-400 leading-tight">${t.desc}</p>
        </div>`;
    });

    function goHome() {
      document.getElementById('home-view').classList.remove('hidden');
      document.getElementById('lesson-view').classList.add('hidden');
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    function openLesson(id) {
      const topic = topics.find(t => t.id === id);
      const d = data[id];
      if (!d) return;

      document.getElementById('home-view').classList.add('hidden');
      document.getElementById('lesson-view').classList.remove('hidden');
      document.getElementById('lesson-title').innerHTML = `${topic.emoji} ${topic.cn} <span class="text-lg font-normal text-gray-500">(${topic.py})</span>`;
      document.getElementById('lesson-subtitle').textContent = topic.title;

      let html = `<h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="book-open" class="text-rose-500"></i> 词汇 cí huì (Kosa Kata)</h3>`;
      html += '<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mb-8">';
      d.vocab.forEach((v) => {
        html += `<div class="bg-white rounded-xl p-4 border shadow-sm text-center fade-in cursor-pointer hover:shadow-md hover:border-rose-300 transition group" onclick="speakWord('${v[0]}')">
          <div class="chinese text-2xl font-bold text-rose-700 mb-1">${v[0]}</div>
          <div class="text-[10px] text-blue-500 font-semibold mb-1 flex items-center justify-center gap-1">
             <i data-lucide="volume-2" class="w-3 h-3"></i> Dengar
          </div>
          <div class="text-xs text-gray-400 italic mb-1">${v[1]}</div>
          <div class="text-sm font-semibold text-gray-700">${v[2]}</div>
        </div>`;
      });
      html += '</div>';

      html += `<h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="message-circle" class="text-rose-500"></i> 场景对话 chǎng jǐng duì huà (Perbualan Situasi)</h3>
        <div class="space-y-6">`;
      d.conversation.forEach((set, idx) => {
        html += `<div class="bg-white rounded-xl border shadow-sm p-5">
          <h4 class="text-sm font-bold text-rose-600 mb-4 bg-rose-50 px-3 py-1 rounded-lg inline-block">Set ${idx + 1}</h4>
          <div class="space-y-4">`;
        set.forEach(c => {
          const isA = c.speaker === 'A';
          html += `<div class="flex ${isA ? '' : 'justify-end'}">
            <div class="${isA ? 'bg-rose-50 border-rose-200' : 'bg-blue-50 border-blue-200'} border rounded-xl p-3 max-w-[90%] cursor-pointer hover:shadow-sm transition" onclick="speakWord('${c.cn}')">
              <div class="flex items-center gap-2 mb-1">
                 <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${isA ? 'bg-rose-200 text-rose-800' : 'bg-blue-200 text-blue-800'}">${c.speaker}</span>
                 <div class="chinese text-base font-bold text-gray-800">${c.cn}</div>
              </div>
              <div class="text-[11px] text-gray-400 italic mb-1 pl-7">${c.py}</div>
              <div class="text-xs font-medium text-gray-600 border-t ${isA ? 'border-rose-100' : 'border-blue-100'} pt-1.5 pl-7">${c.ms}</div>
            </div>
          </div>`;
        });
        html += `</div></div>`;
      });
      html += '</div>';

      html += `<div class="mt-8">
        <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="target" class="text-rose-500"></i> 快速测验 kuài sù cè yàn (Kuiz Pantas)</h3>
        <div id="quiz-area"></div>
      </div>`;

      document.getElementById('lesson-content').innerHTML = html;
      startQuiz(id);
      lucide.createIcons();
    }

    function speakWord(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.8;
        window.speechSynthesis.speak(utterance);
      }
    }

    function startQuiz(id) {
      const vocab = data[id].vocab;
      const area = document.getElementById('quiz-area');
      let qi = 0, score = 0;
      const questions = [...vocab].sort(() => Math.random() - 0.5).slice(0, 10);

      function showQ() {
        if (qi >= questions.length) {
          area.innerHTML = `<div class="bg-emerald-50 border-2 border-emerald-300 rounded-xl p-8 text-center fade-in">
            <div class="text-5xl mb-4">🎉</div>
            <p class="font-bold text-2xl text-emerald-800 mb-4">Skor Anda: ${score} / ${questions.length}</p>
            <button onclick="startQuiz('${id}')" class="px-6 py-3 bg-emerald-600 text-white font-bold rounded-lg hover:bg-emerald-700 transition shadow-md">
              Cuba Lagi (zài shì yí cì)
            </button>
          </div>`;
          return;
        }
        
        const q = questions[qi];
        const wrong = vocab.filter(v => v[0] !== q[0]).sort(() => Math.random() - 0.5).slice(0, 3);
        const opts = [...wrong.map(w => w[2]), q[2]].sort(() => Math.random() - 0.5);
        
        area.innerHTML = `<div class="bg-white border-2 border-gray-100 rounded-xl p-6 fade-in shadow-sm">
          <div class="flex justify-between items-center mb-4">
            <p class="text-sm font-semibold text-rose-500 bg-rose-50 px-3 py-1 rounded-full">Soalan ${qi+1} / ${questions.length}</p>
            <button onclick="speakWord('${q[0]}')" class="text-blue-500 hover:text-blue-700 bg-blue-50 p-2 rounded-full transition">
              <i data-lucide="volume-2" class="w-5 h-5"></i>
            </button>
          </div>
          <p class="chinese text-4xl font-bold text-gray-800 text-center mb-2">${q[0]}</p>
          <p class="text-base text-center italic text-gray-500 mb-6">${q[1]}</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="opts"></div>
        </div>`;
        
        lucide.createIcons();
        const optsEl = document.getElementById('opts');
        opts.forEach(o => {
          const btn = document.createElement('button');
          btn.className = 'p-4 border-2 rounded-xl font-semibold text-gray-700 hover:bg-gray-50 hover:border-gray-300 transition text-lg';
          btn.textContent = o;
          btn.onclick = () => {
            if (o === q[2]) { score++; btn.classList.add('bg-emerald-100','border-emerald-500','text-emerald-800'); }
            else { btn.classList.add('bg-red-100','border-red-500','text-red-800'); }
            optsEl.querySelectorAll('button').forEach(b => { 
              b.disabled = true; 
              if(b.textContent === q[2]) b.classList.add('bg-emerald-100','border-emerald-500','text-emerald-800');
            });
            setTimeout(() => { qi++; showQ(); }, 1200);
          };
          optsEl.appendChild(btn);
        });
      }
      showQ();
    }

    const defaultConfig = { app_title: '学习中文 xué xí zhōng wén', background_color: '#fff7ed', primary_action_color: '#be123c' };

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (config) => {
          const t = document.getElementById('main-title');
          if (t) t.textContent = '🀄 ' + (config.app_title || defaultConfig.app_title);
          document.getElementById('app').style.background = `linear-gradient(135deg, ${config.background_color || defaultConfig.background_color}, #f0fdf4)`;
        }
      });
    }
    lucide.createIcons();
  </script>
</body>
</html>
