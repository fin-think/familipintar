        const SimplePieChart = ({ data, colors }) => {
          let cumulativePercent = 0;
          const getCoords = (p) => [Math.cos(2 * Math.PI * p), Math.sin(2 * Math.PI * p)];
          if (!data || data.length === 0 || data.every(d => d.percent <= 0)) return <div className="w-full h-full rounded-full bg-slate-200 flex items-center justify-center text-xs text-slate-500">Tiada Data</div>;
          return (
            <svg viewBox="-1 -1 2 2" className="w-full h-full drop-shadow-md" style={{ transform: 'rotate(-90deg)' }}>
              {data.map((slice, i) => {
                if (slice.percent <= 0) return null;
                if (slice.percent >= 99.9) return <circle cx="0" cy="0" r="1" fill={colors[i % colors.length]} key={i} />;
                const [startX, startY] = getCoords(cumulativePercent / 100);
                cumulativePercent += slice.percent;
                const [endX, endY] = getCoords(cumulativePercent / 100);
                const largeArcFlag = slice.percent > 50 ? 1 : 0;
                return <path d={`M ${startX} ${startY} A 1 1 0 ${largeArcFlag} 1 ${endX} ${endY} L 0 0`} fill={colors[i % colors.length]} key={i} />

            </svg>

          sspnFund: 0, asbAnakFund: 0, educationInflation: 6, universityType: 'local', funeralCost: 2000, sepencarianPercent: 50,

        };

        function App() {
          const [isFirebaseReady, setIsFirebaseReady] = useState(false);
          const [user, setUser] = useState(null);
          const [loadingData, setLoadingData] = useState(true);
          const [isSaving, setIsSaving] = useState(false);
          
          const [activeTab, setActiveTab] = useState(1);
          const [showReport, setShowReport] = useState(false);
          
          const [appData, setAppData] = useState(defaultData);

// State untuk Paywall Dashboard
  const [isDashboardUnlocked, setIsDashboardUnlocked] = useState(false); 
  const [showPaywall, setShowPaywall] = useState(false);

  // Fungsi untuk memintas klik tab
  const handleTabClick = (tabId) => {
    // Jika tab ke-6 (Dashboard) ditekan dan belum dibuka kuncinya

      setShowPaywall(true); // Keluarkan pop-up
    } else {
      setActiveTab(tabId); // Buka tab macam biasa
    }
  };
            
          // PENGURUSAN AUTENTIKASI & PANGKALAN DATA
          useEffect(() => {
              const handleFbReady = () => setIsFirebaseReady(true);
              window.addEventListener('firebaseLoaded', handleFbReady);
              if (window.fbAuth) setIsFirebaseReady(true);
              return () => window.removeEventListener('firebaseLoaded', handleFbReady);
          }, []);

          useEffect(() => {
              if (!isFirebaseReady) return;
              const unsubscribe = window.fbOnAuth(window.fbAuth, async (u) => {
                  if (u) {
                      setUser(u);
                      await fetchEcosystemData(u.uid);
                  } else {
                      setUser(null);
                      setLoadingData(false);
                  }
              });
              return () => unsubscribe();
          }, [isFirebaseReady]);

          // ENJIN PENYEDUT DATA BERSEPADU (myNasab -> myTADBIR)
          const fetchEcosystemData = async (uid) => {
              try {
                  const docRef = window.fbDoc(window.fbDb, "mytadbir_profiles", uid);
                  const docSnap = await window.fbGetDoc(docRef);
                  let mergedData = { ...defaultData };
                  
                  if (docSnap.exists()) {
                      mergedData = { ...mergedData, ...docSnap.data().raw_data };
                  }

                  const q = window.fbQuery(window.fbCollection(window.fbDb, "mynasab_nodes"), window.fbWhere("owner_uid", "==", uid));
                  const nasabSnap = await window.fbGetDocs(q);
                  
                  let childrenList = [];
                  let spouse = false, mother = false, father = false;
                  let selfAge = mergedData.age;
                  let selfGender = mergedData.userGender;

                  nasabSnap.forEach(d => {
                      const data = d.data();
                      const rel = (data.relationship || data.hubungan || '').toLowerCase().trim();
                      const status = (data.status || '').toLowerCase().trim();
                      
                      const isMeninggal = status === 'meninggal' || status === 'meninggal dunia';
                      const isMertua = rel.includes('mertua') || rel.includes('mentua');
                      
                      const calcAge = (dobStr) => {
                          if (!dobStr) return 0;
                          const birthDate = new Date(dobStr);
                          const today = new Date();
                          let calc = today.getFullYear() - birthDate.getFullYear();
                          const m = today.getMonth() - birthDate.getMonth();
                          if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) calc--;
                          return calc;
                      };

                      let jantinaDikesan = 'lelaki'; 
                      const gText = (data.gender || data.jantina || '').toString().toLowerCase().trim();
                      const nText = (data.name || data.nama || '').toLowerCase();
                      
                      if (gText === 'p' || gText === 'perempuan' || gText === 'female' || gText === 'f') jantinaDikesan = 'perempuan';
                      else if (gText === 'l' || gText === 'lelaki' || gText === 'male' || gText === 'm') jantinaDikesan = 'lelaki';
                      else if (rel.includes('perempuan')) jantinaDikesan = 'perempuan';
                      else if (rel.includes('lelaki')) jantinaDikesan = 'lelaki';
                      else if (nText.includes('binti ')) jantinaDikesan = 'perempuan';

                      if (rel.includes('diri sendiri') || rel.includes('induk')) {
                          selfAge = calcAge(data.dob) || selfAge;
                          selfGender = jantinaDikesan;
                      }
                      
                      if (rel.includes('anak') && !rel.includes('saudara') && !isMeninggal) {
                          childrenList.push({
                              id: d.id,
                              name: data.name || data.nama || `Anak ${childrenList.length + 1}`,
                              age: calcAge(data.dob) || 1,
                              gender: jantinaDikesan
                          });
                      }
                      
                      if (!isMeninggal && !isMertua) {
                          if (rel.includes('suami') || rel.includes('isteri') || rel.includes('pasangan')) spouse = true;
                          if (rel.match(/ibu|mak|mama/)) mother = true;
                          if (rel.match(/ayah|bapa|abah|papa/)) father = true;
                      }
                  });

                  childrenList.sort((a, b) => b.age - a.age);

 // Gabung anggaran kos pengajian daripada myKids (ID anak sama dengan ID dokumen mykids_plans)
                  try {
                      const planSnap = await window.fbGetDocs(window.fbQuery(window.fbCollection(window.fbDb, "mykids_plans"), window.fbWhere("owner_uid", "==", uid)));
                      const planMap = {};
                      planSnap.forEach(p => { planMap[p.id] = p.data(); });
                      childrenList.forEach(c => {
                          const p = planMap[c.id];
                          if (p && p.kos_semasa > 0) {
                              c.eduCost = p.kos_semasa;            // harga hari ini, sudah termasuk destinasi
                              c.eduUniAge = p.umur_masuk || 0;
                              c.eduType = p.jenis_uni || 'local';
                          }
                      });
                  } catch (e) { console.warn("Gagal baca anggaran myKids:", e.message); }

                  
                  if(selfAge > 0) mergedData.age = selfAge;
                  mergedData.userGender = selfGender;
                  mergedData.hasSpouse = spouse;
                  mergedData.hasMother = mother;
                  mergedData.hasFather = father;
                  
                  if (childrenList.length > 0) {
                      mergedData.childrenData = childrenList;
                  }

                  setAppData(mergedData);
              } catch (e) { console.error("Ralat memuatkan ekosistem data:", e); }
              setLoadingData(false);
          };

          const handleLogin = async (e) => {
              e.preventDefault();
              try { await window.fbSignIn(window.fbAuth, e.target.email.value, e.target.password.value); } 
              catch (err) { alert("Log masuk gagal. Sila semak emel & kata laluan."); }
          };

          // =========================================================================
          // DESTRUCTURE DATA (DIKEKALKAN DARI KOD ASAL BOS 100%)
          // =========================================================================
          const {
            userGender, age, gajiHakiki, pendapatanSampingan, kwspPotongan, socsoPotongan,
            dapurExpenses, utilitiExpenses, transportExpenses, entertainmentExpenses, insuranceExpenses, childrenData,
            asb, th, unitTrust, tunai, kwsp, emas, rumahValue, keretaValue,
            debtsList, extraBudget, debtStrategy, consolRate, consolYear,
            retireAge, lifeExpectancy, inflationRate, assetReturnRate, uniAge, currentEduCost,
            sspnFund, asbAnakFund, educationInflation, universityType,
            funeralCost, sepencarianPercent, wasiatPercent, hasSpouse, hasMother, hasFather, currentTakaful
          } = appData;

          // HELPER FUNCTIONS 
          const setUserGender = (val) => setAppData(p => ({...p, userGender: val}));
          const setAge = (val) => setAppData(p => ({...p, age: val}));
          const setGajiHakiki = (val) => setAppData(p => ({...p, gajiHakiki: val}));
          const setPendapatanSampingan = (val) => setAppData(p => ({...p, pendapatanSampingan: val}));
          const setKwspPotongan = (val) => setAppData(p => ({...p, kwspPotongan: val}));
          const setSocsoPotongan = (val) => setAppData(p => ({...p, socsoPotongan: val}));
          const setDapurExpenses = (val) => setAppData(p => ({...p, dapurExpenses: val}));
          const setUtilitiExpenses = (val) => setAppData(p => ({...p, utilitiExpenses: val}));
          const setTransportExpenses = (val) => setAppData(p => ({...p, transportExpenses: val}));
          const setEntertainmentExpenses = (val) => setAppData(p => ({...p, entertainmentExpenses: val}));
          const setInsuranceExpenses = (val) => setAppData(p => ({...p, insuranceExpenses: val}));
          const setChildrenData = (val) => setAppData(p => ({...p, childrenData: val}));

          const setAsb = (val) => setAppData(p => ({...p, asb: val}));
          const setTh = (val) => setAppData(p => ({...p, th: val}));
          const setUnitTrust = (val) => setAppData(p => ({...p, unitTrust: val}));
          const setTunai = (val) => setAppData(p => ({...p, tunai: val}));
          const setKwsp = (val) => setAppData(p => ({...p, kwsp: val}));
          const setEmas = (val) => setAppData(p => ({...p, emas: val}));
          const setRumahValue = (val) => setAppData(p => ({...p, rumahValue: val}));
          const setKeretaValue = (val) => setAppData(p => ({...p, keretaValue: val}));

          const setDebtsList = (val) => setAppData(p => ({...p, debtsList: val}));
          const setExtraBudget = (val) => setAppData(p => ({...p, extraBudget: val}));
          const setDebtStrategy = (val) => setAppData(p => ({...p, debtStrategy: val}));
          const setConsolRate = (val) => setAppData(p => ({...p, consolRate: val}));
          const setConsolYear = (val) => setAppData(p => ({...p, consolYear: val}));

          const setRetireAge = (val) => setAppData(p => ({...p, retireAge: val}));
          const setLifeExpectancy = (val) => setAppData(p => ({...p, lifeExpectancy: val}));
          const setInflationRate = (val) => setAppData(p => ({...p, inflationRate: val}));
          const setAssetReturnRate = (val) => setAppData(p => ({...p, assetReturnRate: val}));
          const setUniAge = (val) => setAppData(p => ({...p, uniAge: val}));
          const setCurrentEduCost = (val) => setAppData(p => ({...p, currentEduCost: val}));
          const setSspnFund = (val) => setAppData(p => ({...p, sspnFund: val}));
          const setAsbAnakFund = (val) => setAppData(p => ({...p, asbAnakFund: val}));
          const setEducationInflation = (val) => setAppData(p => ({...p, educationInflation: val}));
          const setUniversityType = (val) => setAppData(p => ({...p, universityType: val}));

          const setFuneralCost = (val) => setAppData(p => ({...p, funeralCost: val}));
          const setSepencarianPercent = (val) => setAppData(p => ({...p, sepencarianPercent: val}));
          const setWasiatPercent = (val) => setAppData(p => ({...p, wasiatPercent: val}));
          const setHasSpouse = (val) => setAppData(p => ({...p, hasSpouse: val}));
          const setHasMother = (val) => setAppData(p => ({...p, hasMother: val}));
          const setHasFather = (val) => setAppData(p => ({...p, hasFather: val}));
          const setCurrentTakaful = (val) => setAppData(p => ({...p, currentTakaful: val}));

          const toNumber = (v) => {
            const n = parseFloat(v);
            return Number.isFinite(n) ? n : 0;
          };

          // =========================================================================
          // DERIVED VARIABLES (PENGIRAAN ASAL 100% DIKEMBALIKAN)
          // =========================================================================
          const numSons = childrenData.filter(c => c.gender === 'lelaki').length;
          const numDaughters = childrenData.filter(c => c.gender === 'perempuan').length;
          const spouseGender = userGender === 'lelaki' ? 'isteri' : 'suami';
          
          const annualIncome = (gajiHakiki + pendapatanSampingan) * 12;

          // --- ANALISIS DSR & HUTANG (d'DEBT Core Logic) ---
          const debtAnalysisResult = useMemo(() => {
              const totalIncome = gajiHakiki + pendapatanSampingan;
              const totalCommitment = debtsList.reduce((sum, d) => sum + d.minPayment, 0);
              const totalBalance = debtsList.reduce((sum, d) => sum + d.balance, 0);
              const dsr = totalIncome > 0 ? (totalCommitment / totalIncome) * 100 : 0;

              let sortedDebts = [...debtsList];
              if (debtStrategy === 'snowball') sortedDebts.sort((a, b) => a.balance - b.balance);
              else if (debtStrategy === 'avalanche') sortedDebts.sort((a, b) => b.interest - a.interest);

              let totalInterestPaid = 0;
              let currentMonth = 0;
              const MAX_MONTHS = 1200;
              let simDebts = sortedDebts.map(d => ({ ...d, currentBalance: d.balance, monthsToFinish: 0 }));
              
              let balanceAtRetirement = 0;
              const retirementMonth = Math.max(0, (retireAge - age) * 12);

              if (debtStrategy !== 'consolidation') {
                  while (simDebts.some(d => d.currentBalance > 0) && currentMonth < MAX_MONTHS) {
                      if (currentMonth === retirementMonth) {
                          balanceAtRetirement = simDebts.reduce((sum, d) => sum + Math.max(0, d.currentBalance), 0);
                      }

                      if (balanceAtRetirement === 0 && currentMonth >= retirementMonth) {
                        balanceAtRetirement = simDebts.reduce((sum, d) => sum + Math.max(0, d.currentBalance), 0);
                      }
                      
                      currentMonth++;
                      let monthlyExtraAvailable = extraBudget;

                      for (let d of simDebts) {
                          if (d.currentBalance <= 0) continue;
                          let monthlyRate = (d.interest / 100) / 12;
                          let interestCharged = d.currentBalance * monthlyRate;
                          totalInterestPaid += interestCharged;
                          d.currentBalance += interestCharged;

                          let pay = Math.min(d.currentBalance, d.minPayment);
                          d.currentBalance -= pay;

                          if (d.currentBalance <= 0.01) {
                              d.currentBalance = 0;
                              if (d.monthsToFinish === 0) d.monthsToFinish = currentMonth;
                          }
                      }

                      let freedUpMinPayments = simDebts.filter(d => d.currentBalance === 0).reduce((sum, d) => sum + d.minPayment, 0);
                      monthlyExtraAvailable += freedUpMinPayments;

                      for (let d of simDebts) {
                          if (d.currentBalance > 0) {
                              let extraPay = Math.min(d.currentBalance, monthlyExtraAvailable);
                              d.currentBalance -= extraPay;
                              monthlyExtraAvailable -= extraPay;
                              
                              if (d.currentBalance <= 0.01) {
                                  d.currentBalance = 0;
                                  if (d.monthsToFinish === 0) d.monthsToFinish = currentMonth;
                              }
                              if (monthlyExtraAvailable <= 0) break;
                          }
                      }
                  }
                  
                  if (currentMonth <= retirementMonth && balanceAtRetirement === 0 && simDebts.every(d => d.currentBalance === 0)) {
                      balanceAtRetirement = 0; 
                  } else if (currentMonth > retirementMonth && balanceAtRetirement === 0) {
                      balanceAtRetirement = simDebts.reduce((sum, d) => sum + d.currentBalance, 0);
                  }
              } else {
                  const totalInterestConsol = totalBalance * (consolRate / 100) * consolYear;
                  const totalLoanConsol = totalBalance + totalInterestConsol;
                  const newMonthlyConsol = consolYear > 0 ? totalLoanConsol / (consolYear * 12) : 0;
                  const savingsConsol = totalCommitment - newMonthlyConsol;
                  
                  if (retirementMonth >= consolYear * 12) {
                      balanceAtRetirement = 0;
                  } else {
                      const remainingMonths = (consolYear * 12) - retirementMonth;
                      balanceAtRetirement = (remainingMonths / (consolYear * 12)) * totalBalance; 
                  }

                  return {
                      totalIncome, totalCommitment, totalBalance, dsr,
                      payoffMonths: consolYear * 12,
                      payoffInterest: totalInterestConsol,
                      payoffDetails: [],
                      consolNewMonthly: newMonthlyConsol,
                      consolSavings: savingsConsol,
                      balanceAtRetirement
                  };
              }

              return {
                  totalIncome, totalCommitment, totalBalance, dsr,
                  payoffMonths: currentMonth,
                  payoffInterest: totalInterestPaid,
                  payoffDetails: simDebts,
                  consolNewMonthly: 0,
                  consolSavings: 0,
                  balanceAtRetirement
              };

         // Anak yang ada anggaran myKids guna kos & umur masuk uni sendiri (tiada darab x5).

                </div>

{/* MODAL PAYWALL DASHBOARD */}
      {showPaywall && (
        <div className="fixed inset-0 bg-slate-900/80 z-[100] flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
          <div className="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
            <div className="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">💎</div>
            <h3 className="text-2xl font-bold text-slate-800 mb-2">Akses Analisis Penuh</h3>
            
            <p className="text-slate-500 text-sm mb-6">
              Satu langkah terakhir! Gunakan <strong className="text-blue-600">10 Kredit</strong> untuk menjana laporan Net Worth, Unjuran Persaraan dan Analisis DSR anda.
            </p>
            
            <button 
              onClick={() => {
                // Di sini bos letak fungsi tolak kredit Firebase.
                // Contoh: prosesTolakKredit(10).then(() => {
                
                setIsDashboardUnlocked(true); // Buka kunci
                setShowPaywall(false); // Tutup popup
                setActiveTab(6); // <-- TUKAR KE NOMBOR 6 DI SINI
                
                // });
              }} 
              className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all mb-3 flex justify-center items-center gap-2"
            >
              Buka Analisis (10 Kredit)
            </button>
            
            <button 
              onClick={() => setShowPaywall(false)} 
              className="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition-all"
            >
              Nanti Dulu
            </button>
          </div>
        </div>
      )}
                  
              </main>

              {/* BUTANG CETAK LAPORAN JANGAN DIBUANG */}
              {activeTab === 6 && (
                <div className="max-w-6xl mx-auto px-4 mt-8 pb-12 flex justify-center">
                  <button onClick={() => setShowReport(true)} className="px-8 py-4 bg-sky-600 hover:bg-sky-700 text-white rounded-xl font-bold shadow-lg transition-colors flex items-center gap-3 text-lg">
                    <FileText size={24} /> Lihat / Cetak Laporan Penuh
                  </button>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
